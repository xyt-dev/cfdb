<!doctype html>
<html lang="zh-CN" data-theme="catppuccin">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CF Database — Codeforces 题目库</title>
    <script src="/vendor/marked.min.js"></script>
    <script src="/vendor/highlight.min.js"></script>
    <style>
      :root {
        --radius: 10px;
        --sans: "Noto Sans SC", "PingFang SC", sans-serif;
        --serif: Georgia, "Noto Serif SC", "Songti SC", serif;
      }
      /* ═══ Catppuccin Mocha ═══ */
      [data-theme="catppuccin"] {
        --bg: #1e1e2e;
        --surface: #313244;
        --surface2: #45475a;
        --border: #585b70;
        --text: #cdd6f4;
        --subtext: #a6adc8;
        --accent: #89b4fa;
        --accent2: #f38ba8;
        --teal: #94e2d5;
        --r900: #6c7086;
        --r1200: #8a8f98;
        --r1400: #a6e3a1;
        --r1600: #94e2d5;
        --r1900: #89dceb;
        --r2100: #cba6f7;
        --r2400: #fab387;
        --r3000: #f38ba8;
      }
      /* ═══ Gruvbox Dark ═══ */
      [data-theme="gruvbox"] {
        --bg: #282828;
        --surface: #3c3836;
        --surface2: #504945;
        --border: #665c54;
        --text: #ebdbb2;
        --subtext: #a89984;
        --accent: #83a598;
        --accent2: #fb4934;
        --teal: #8ec07c;
        --r900: #928374;
        --r1200: #a89984;
        --r1400: #b8bb26;
        --r1600: #8ec07c;
        --r1900: #83a598;
        --r2100: #d3869b;
        --r2400: #fe8019;
        --r3000: #fb4934;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        padding: 20px;
        transition:
          background 0.3s,
          color 0.3s;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 4px;
      }
      h1 .accent {
        color: var(--accent);
      }
      .sub {
        color: var(--subtext);
        font-size: 13px;
        margin-bottom: 16px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
      }
      .theme-btn {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px 14px;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 13px;
      }
      .theme-btn:hover {
        border-color: var(--accent);
      }

      /* 爬取进度条 */
      .progress-bar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 14px;
        margin: 10px 0;
        font-size: 13px;
        color: var(--subtext);
        display: none;
        align-items: center;
        gap: 10px;
      }
      .progress-bar.show {
        display: flex;
      }
      .progress-track {
        flex: 1;
        height: 6px;
        background: var(--surface2);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.5s;
      }

      .filters {
        background: var(--surface);
        border-radius: var(--radius);
        padding: 14px;
        margin: 14px 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
        align-items: end;
        border: 1px solid var(--border);
        position: relative; /* 迷你按钮右上角定位 */
      }
      .filters label {
        display: block;
        font-size: 12px;
        color: var(--subtext);
        margin-bottom: 4px;
      }
      .filters input,
      .filters select {
        width: 100%;
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 9px;
        font-size: 13px;
      }
      .filters input:focus,
      .filters select:focus {
        outline: none;
        border-color: var(--accent);
      }
      .reset-btn {
        width: 100%;
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 9px;
        font-size: 13px;
        cursor: pointer;
      }
      .reset-btn:hover {
        border-color: var(--accent);
      }
      .tag-chips {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-height: 84px;
        overflow-y: auto;
      }
      .chip {
        background: var(--surface2);
        color: var(--subtext);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }
      .chip.on {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
        font-weight: 600;
      }
      .stats-line {
        color: var(--subtext);
        font-size: 13px;
        margin-bottom: 10px;
      }
      .stats-line b {
        color: var(--accent);
      }
      .reset-btn.mini {
        position: absolute;
        top: 10px;
        right: 10px;
        width: auto;
        padding: 2px 9px;
        font-size: 12px;
        border-radius: 5px;
        background: transparent;
        color: var(--subtext);
        z-index: 1;
      }
      .reset-btn.mini:hover {
        color: var(--text);
        border-color: var(--accent);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border-radius: var(--radius);
        overflow: hidden;
      }
      thead th {
        text-align: left;
        padding: 10px 12px;
        font-size: 12px;
        color: var(--subtext);
        background: var(--surface2);
        white-space: nowrap;
      }
      tbody tr {
        border-top: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.15s;
      }
      tbody tr:hover {
        background: var(--surface2);
      }
      td {
        padding: 9px 12px;
        font-size: 13px;
        vertical-align: middle;
      }
      .id {
        font-family: monospace;
        color: var(--accent);
        white-space: nowrap;
      }
      .name {
        max-width: 340px;
      }
      .rating {
        font-weight: 700;
        white-space: nowrap;
      }
      .solved {
        font-family: monospace;
        white-space: nowrap;
      }
      .tags-td {
        max-width: 380px;
      }
      .mini-tag {
        display: inline-block;
        font-size: 11px;
        color: var(--subtext);
        margin-right: 6px;
      }
      .link {
        color: var(--accent);
        text-decoration: none;
        font-size: 12px;
      }
      .link:hover {
        text-decoration: underline;
      }
      .empty {
        text-align: center;
        color: var(--subtext);
        padding: 40px;
      }

      .pager {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .pager button {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
      }
      .pager button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .pager button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .pager .cur {
        background: var(--accent);
        color: var(--bg);
        font-weight: 700;
        border-color: var(--accent);
      }
      .pager .info {
        color: var(--subtext);
        font-size: 12px;
      }

      /* ═══ 详情视图（新页面式）═══ */
      #detail-view {
        display: none;
        max-width: 1200px;
        margin: 0 auto;
      }
      #detail-view.show {
        display: block;
      }
      .detail-bar {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 16px;
        margin-bottom: 18px;
      }
      .back-btn {
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 14px;
        cursor: pointer;
        font-size: 13px;
      }
      .back-btn:hover {
        border-color: var(--accent);
      }
      .detail-title {
        font-size: 16px;
        font-weight: 600;
        flex: 1;
        min-width: 200px;
      }
      .detail-meta {
        font-size: 12px;
        color: var(--subtext);
      }
      .tabs {
        display: flex;
        gap: 6px;
      }
      .tab {
        background: var(--surface2);
        color: var(--subtext);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 18px;
        cursor: pointer;
        font-size: 13px;
      }
      .tab.on {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
        font-weight: 600;
      }

      /* 阅读区：居中窄栏，衬线排版，无内部滚动条（高度自适应） */
      .reader {
        max-width: 1200px; /* 与上方 detail-bar 同宽对齐 */
        margin: 0 auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px 34px;
      }
      .reader .hint {
        color: var(--subtext);
        text-align: center;
        padding: 50px 0;
        font-size: 14px;
        line-height: 2;
      }
      .statement-frame {
        width: 100%;
        border: none;
        display: block;
        background: transparent;
        min-height: 420px;
      }
      /* ═══ 代码高亮主题（CSS 变量 → 自动跟随 catppuccin/gruvbox）═══ */
      .hljs {
        background: transparent;
        color: var(--text);
      }
      .hljs-keyword,
      .hljs-selector-tag,
      .hljs-literal {
        color: var(--accent2);
      }
      .hljs-string,
      .hljs-regexp,
      .hljs-addition {
        color: var(--teal);
      }
      .hljs-number,
      .hljs-symbol,
      .hljs-bullet {
        color: var(--r2400);
      }
      .hljs-comment,
      .hljs-quote {
        color: var(--subtext);
        font-style: italic;
      }
      .hljs-title,
      .hljs-function,
      .hljs-title.function_,
      .hljs-section {
        color: var(--accent);
      }
      .hljs-type,
      .hljs-built_in,
      .hljs-attr,
      .hljs-attribute,
      .hljs-variable,
      .hljs-template-variable {
        color: var(--r1900);
      }
      .hljs-meta,
      .hljs-selector-class,
      .hljs-selector-id {
        color: var(--r2100);
      }
      .hljs-params {
        color: var(--text);
      }
      .hljs-deletion {
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <!-- ═══ 列表视图 ═══ -->
    <div class="container" id="list-view">
      <div class="topbar">
        <div>
          <h1>CF <span class="accent">Database</span></h1>
          <div class="sub" id="total-line">加载中...</div>
        </div>
        <button class="theme-btn" onclick="toggleTheme()">🎨 主题</button>
      </div>

      <div class="progress-bar" id="progress-bar">
        <span id="progress-text">预爬中...</span>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="filters">
        <button
          class="reset-btn mini"
          title="恢复默认筛选"
          onclick="resetFilters()"
        >
          ↺
        </button>
        <div>
          <label>Rating 下限</label
          ><input
            type="number"
            id="f-rmin"
            placeholder="800"
            min="800"
            max="3500"
          />
        </div>
        <div>
          <label>Rating 上限</label
          ><input
            type="number"
            id="f-rmax"
            placeholder="3500"
            min="800"
            max="3500"
          />
        </div>
        <div>
          <label>解题数 ≥</label
          ><input type="number" id="f-solved" placeholder="0" />
        </div>
        <div>
          <label>搜索名称</label
          ><input
            type="text"
            id="f-search"
            placeholder="例如: tree / dp / 1400..."
          />
        </div>
        <div>
          <label>排序</label>
          <select id="f-sort">
            <option value="rating-desc">Rating 降序</option>
            <option value="rating-asc">Rating 升序</option>
            <option value="solved-desc">解题数 降序</option>
            <option value="solved-asc">解题数 升序</option>
            <option value="id-asc" selected>题号 升序</option>
            <option value="name-asc">名称</option>
          </select>
        </div>
        <div class="tag-chips" id="tag-chips"></div>
      </div>

      <div class="stats-line" id="stats-line"></div>
      <table>
        <thead>
          <tr>
            <th>题号</th>
            <th>名称</th>
            <th>Rating</th>
            <th>解题数</th>
            <th>标签</th>
            <th>链接</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="pager" id="pager"></div>
    </div>

    <!-- ═══ 详情视图 ═══ -->
    <div id="detail-view">
      <div class="detail-bar">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <div class="detail-title" id="detail-title"></div>
        <div class="detail-meta" id="detail-meta"></div>
        <div class="tabs">
          <button
            class="tab on"
            id="tab-statement"
            onclick="switchTab('statement')"
          >
            📄 题面
          </button>
          <button
            class="tab"
            id="tab-editorial"
            onclick="switchTab('editorial')"
          >
            📖 题解
          </button>
        </div>
      </div>
      <div class="reader" id="reader"></div>
    </div>

    <script>
      let ALL = [],
        FILTERED = [];
      const PAGE = 50;
      let page = 1;
      const activeTags = new Set();
      let restorePage = 1;

      /* 筛选状态持久化到 URL 参数（刷新/滚动天然保留，无写入竞态） */
      function saveState() {
        try {
          const p = new URLSearchParams();
          if ($("f-rmin").value) p.set("rmin", $("f-rmin").value);
          if ($("f-rmax").value) p.set("rmax", $("f-rmax").value);
          if ($("f-solved").value) p.set("solved", $("f-solved").value);
          if ($("f-search").value) p.set("search", $("f-search").value);
          if ($("f-sort").value !== "id-asc") p.set("sort", $("f-sort").value);
          if (activeTags.size) p.set("tags", [...activeTags].join(","));
          if (page > 1) p.set("page", page);
          const qs = p.toString();
          const url = location.pathname + (qs ? "?" + qs : "") + location.hash;
          history.replaceState(null, "", url); // 不产生历史记录
        } catch (e) {}
      }
      function restoreState() {
        try {
          const p = new URLSearchParams(location.search);
          $("f-rmin").value = p.get("rmin") || "";
          $("f-rmax").value = p.get("rmax") || "";
          $("f-solved").value = p.get("solved") || "";
          $("f-search").value = p.get("search") || "";
          $("f-sort").value = p.get("sort") || "id-asc";
          activeTags.clear();
          const tags = p.get("tags");
          if (tags) tags.split(",").forEach((t) => activeTags.add(t));
          restorePage = parseInt(p.get("page")) || 1;
        } catch (e) {}
      }

      let currentProblem = null;
      let tabCache = {}; // { 'statement': {md, html} | null, 'editorial': ... }
      let currentTab = "statement";
      let loadSeq = 0; // 加载请求序列号：切 tab/切题后旧响应直接丢弃（防竞态覆盖）

      const $ = (id) => document.getElementById(id);
      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }

      /* ═══ 数据加载 ═══ */
      async function load() {
        try {
          const r = await fetch("/api/problems");
          ALL = await r.json();
          const rated = ALL.filter((p) => p.rating).length;
          $("total-line").textContent =
            `共 ${ALL.length} 题（有 rating: ${rated} 题，范围 800-3500）`;
          restoreState();
          buildTagChips();
          apply();
          page = restorePage; // 恢复页码（apply 会重置为 1）
          render();
          pollProgress();
        } catch (err) {
          $("total-line").textContent = "加载失败：" + err;
        }
      }

      /* ═══ 预爬进度 ═══ */
      const STAGE_CN = {
        meta: "刷新元数据",
        statements: "预爬题面",
        editorials: "预爬题解",
        done: "完成",
        error: "异常",
        idle: "空闲",
      };
      let lastDone = -1;
      let lastRefresh = 0;

      /* 静默刷新题目数据（不重置筛选/页码），让列表标记自动更新 */
      async function refreshData() {
        try {
          const r = await fetch("/api/problems");
          ALL = await r.json();
          const savedPage = page;
          apply();
          page = savedPage;
          render();
        } catch (e) {}
      }

      async function pollProgress() {
        try {
          const r = await fetch("/api/progress");
          const s = await r.json();
          const bar = $("progress-bar");
          if (s.stage === "idle" || s.stage === "done") {
            bar.classList.remove("show");
          } else {
            bar.classList.add("show");
            $("progress-text").textContent =
              `${STAGE_CN[s.stage] || s.stage}：${s.done}/${s.total}（已爬 ${s.fetched}，已有 ${s.cached}，失败 ${s.failed}）`;
            $("progress-fill").style.width = s.total
              ? (s.done / s.total) * 100 + "%"
              : "0%";
          }
          // 进度推进或爬取结束 → 自动刷新列表标记（节流 10s）
          const busy =
            s.stage === "meta" ||
            s.stage === "statements" ||
            s.stage === "editorials";
          if (s.done !== lastDone || (busy === false && lastDone !== -1)) {
            const now = Date.now();
            if (now - lastRefresh > 10000) {
              lastRefresh = now;
              refreshData();
            }
          }
          lastDone = s.done;
        } catch (e) {}
        setTimeout(pollProgress, 2000);
      }

      /* ═══ 标签筛选 ═══ */
      function buildTagChips() {
        const counts = {};
        for (const p of ALL)
          for (const t of p.tags) counts[t] = (counts[t] || 0) + 1;
        const box = $("tag-chips");
        box.replaceChildren();
        Object.entries(counts)
          .sort((a, b) => b[1] - a[1])
          .forEach(([t, c]) => {
            const chip = el("span", "chip", `${t} (${c})`);
            chip.dataset.tag = t;
            if (activeTags.has(t)) chip.classList.add("on"); // 恢复选中
            chip.onclick = () => toggleTag(chip);
            box.appendChild(chip);
          });
      }
      function toggleTag(chip) {
        const t = chip.dataset.tag;
        if (activeTags.has(t)) {
          activeTags.delete(t);
          chip.classList.remove("on");
        } else {
          activeTags.add(t);
          chip.classList.add("on");
        }
        apply();
        saveState(); // 标签变化即保存
      }

      /* 恢复默认筛选 */
      function resetFilters() {
        $("f-rmin").value = "";
        $("f-rmax").value = "";
        $("f-solved").value = "";
        $("f-search").value = "";
        $("f-sort").value = "id-asc";
        activeTags.clear();
        document
          .querySelectorAll(".tag-chips .chip.on")
          .forEach((c) => c.classList.remove("on"));
        restorePage = 1;
        try {
          history.replaceState(null, "", location.pathname + location.hash);
        } catch (e) {}
        apply();
      }

      /* ═══ 筛选 + 排序 ═══ */
      function apply() {
        const rmin = parseInt($("f-rmin").value) || 0;
        const rmax = parseInt($("f-rmax").value) || 99999;
        const solved = parseInt($("f-solved").value) || 0;
        const q = $("f-search").value.trim().toLowerCase();
        const sort = $("f-sort").value;

        FILTERED = ALL.filter((p) => {
          if (p.rating && (p.rating < rmin || p.rating > rmax)) return false;
          if (!p.rating && rmin > 0) return false;
          if (p.solvedCount < solved) return false;
          if (activeTags.size && !p.tags.some((t) => activeTags.has(t)))
            return false;
          if (
            q &&
            !(
              p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)
            )
          )
            return false;
          return true;
        });

        const cmp = {
          "rating-desc": (a, b) => (b.rating || -1) - (a.rating || -1),
          "rating-asc": (a, b) => (a.rating || 99999) - (b.rating || 99999),
          "solved-desc": (a, b) => b.solvedCount - a.solvedCount,
          "solved-asc": (a, b) => a.solvedCount - b.solvedCount,
          "id-asc": (a, b) =>
            a.contestId - b.contestId || a.index.localeCompare(b.index),
          "name-asc": (a, b) => a.name.localeCompare(b.name),
        }[sort];
        FILTERED.sort(cmp);
        page = 1;
        render();
      }

      /* ═══ 列表渲染 ═══ */
      function ratingColor(r) {
        if (!r) return "var(--subtext)";
        if (r < 1200) return "var(--r900)";
        if (r < 1400) return "var(--r1200)";

      function render() {

      /* ═══ 视图切换 ═══ */
      function showDetail(p) {
        if (location.hash !== "#/problem/" + p.id) {

        }

        $("detail-view").classList.add("show");
        $("detail-title").textContent = `${p.contestId}${p.index} — ${p.name}`;

        $("tab-editorial").classList.remove("on");

      }
      /* 按钮返回 = 浏览器后退（同一套 popstate 逻辑） */
      function goBack() {

      }
      function showList() {
        try {
          history.replaceState(null, "", location.pathname);

        $("list-view").style.display = "";
      }

      /* ═══ 标签页：题面 / 题解 ═══ */
      function switchTab(tab) {
        if (tab === currentTab) return;

        $("tab-editorial").classList.toggle("on", tab === "editorial");

      function loadTab(tab) {
        if (!currentProblem) return;

        const reader = $("reader");

        if (tabCache[tab]) {
          reader.appendChild(mdFrame(tabCache[tab].md, tabCache[tab].url));

          if (tab === "statement") renderSolutions(reader, seq);

          `/api/statement?contestId=${currentProblem.contestId}&index=${currentProblem.index}`,
        )
          .then((r) => r.json())
          .then((d) => {

            reader.replaceChildren();
            if (!d.md) {

                "div",
                "hint",
                "这道题还没下载过题面。\n\n服务器启动时会自动预爬全部题目（顶部有进度条），\n也可以手动运行：python3 update.py --statements",
              );
              hint.style.whiteSpace = "pre-line";
              reader.appendChild(hint);

              return;
            }
            tabCache[tab] = { md: d.md, url: currentProblem.url };
            reader.appendChild(mdFrame(d.md, currentProblem.url));
            // 题面底部渲染自己的解题代码（无则跳过，不渲染空框）
            renderSolutions(reader, seq);
          })
          .catch((err) => {
            if (seq !== loadSeq) return;
            const d = el("div", "hint", "解题代码加载失败：" + err);
            d.style.color = "var(--red)";
            reader.appendChild(d); // 追加提示，不清空题面

      function loadEditorial(reader, seq) {

          .then((r) => r.json())
          .then((d) => {

                "div",
                "hint",

              hint.style.whiteSpace = "pre-line";
              reader.appendChild(hint);

            tabCache.editorial = { md: d.md, url: d.url };

          .catch((err) => {

      function normalizeProblemHeaders(html, url, titleLink) {

          if (ALL.length) {

              (num
                ? ALL.find((x) => x.name === t && x.contestId === +num)
                : null) || ALL.find((x) => x.name === t);
            if (m) {

          }

      }

        url = url || (currentProblem ? currentProblem.url : "");

    MathJax.typesetPromise([e.target]);
  }
});
/* 代码块语法高亮：仅带语言标注的高亮；裸代码块（样例等）保持纯文本 */
document.querySelectorAll('pre code').forEach(function(el){

    if (el.className && el.className.indexOf('language-') === 0) {
      hljs.highlightElement(el);
    }
  } catch(e) {}
});
/* 图片加载失败：显示占位提示（不隐藏，明确告知） */
document.addEventListener('error', function(e){
  if (e.target && e.target.tagName === 'IMG') {
    var img = e.target;
    if (img.parentNode) {
      var hint = document.createElement('span');
      hint.className = 'img-missing';
      hint.textContent = '🖼️ 图片未加载';
      img.parentNode.replaceChild(hint, img);
    }
  }
}, true);

});

      function toggleTheme() {
        const cur = document.documentElement.dataset.theme;
        document.documentElement.dataset.theme =
          cur === "catppuccin" ? "gruvbox" : "catppuccin";
        localStorage.setItem(
          "cfdb-theme",
          document.documentElement.dataset.theme,
        );
      }
      (function () {
        const saved = localStorage.getItem("cfdb-theme");
        if (saved) document.documentElement.dataset.theme = saved;
      })();

          saveState();
        }),
      );
      $("f-sort").addEventListener("change", () => {
        apply();
        saveState();
      });

      function parseHash() {
        const m = location.hash.match(/#\/problem\/(\d+)([A-Za-z]+)/);
        if (m) {
          const p = ALL.find(
            (x) =>
              x.contestId === Number(m[1]) && x.index === m[2].toUpperCase(),
          );
          if (p) showDetail(p);
        }
      }
      window.addEventListener("hashchange", parseHash);
      // 浏览器前进/后退：popstate 触发（pushState 不触发 hashchange）
      window.addEventListener("popstate", () => {
        if (location.hash.startsWith("#/problem/")) {
          parseHash(); // 前进/后退到详情
        } else {
