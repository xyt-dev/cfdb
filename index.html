<!doctype html>
<html lang="zh-CN" data-theme="gruvbox">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/vendor/cf-favicon.png" />
    <title>Codeforces Database — Codeforces Problem Library</title>
    <script src="/vendor/highlight.min.js"></script>
    <script src="/vendor/highlight-qsharp.js"></script>
    <script src="/reader_payload.js"></script>
    <style>
      /* ═══ CodeNewRoman Nerd Font（本地，零 CDN）═══ */
      @font-face {
        font-family: "CodeNewRoman Nerd Font";
        src: url("/vendor/CodeNewRomanNerdFont-Regular.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "CodeNewRoman Nerd Font";
        src: url("/vendor/CodeNewRomanNerdFont-Bold.otf") format("opentype");
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: "CodeNewRoman Nerd Font";
        src: url("/vendor/CodeNewRomanNerdFont-Italic.otf") format("opentype");
        font-weight: 400;
        font-style: italic;
      }
      @font-face {
        font-family: "CodeNewRoman Nerd Font Mono";
        src: url("/vendor/CodeNewRomanNerdFontMono-Regular.otf")
          format("opentype");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "CodeNewRoman Nerd Font Mono";
        src: url("/vendor/CodeNewRomanNerdFontMono-Bold.otf") format("opentype");
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: "CodeNewRoman Nerd Font Mono";
        src: url("/vendor/CodeNewRomanNerdFontMono-Italic.otf")
          format("opentype");
        font-weight: 400;
        font-style: italic;
      }
      :root {
        --radius: 10px;
        --sans:
          "CodeNewRoman Nerd Font", "Noto Sans SC", "PingFang SC", sans-serif;
        --serif:
          "CodeNewRoman Nerd Font", Georgia, "Noto Serif SC", "Songti SC", serif;
      }
      /* ═══ Catppuccin Mocha ═══ */
      [data-theme="catppuccin"] {
        --bg: #1e1e2e;
        --surface: #313244;
        --surface2: #45475a;
        --border: #585b70;
        --text: #cdd6f4;
        --subtext: #a6adc8;
        --accent: #89b4fa;
        --accent2: #f38ba8;
        --teal: #94e2d5;
        --r900: #6c7086;
        --r1200: #8a8f98;
        --r1400: #a6e3a1;
        --r1600: #94e2d5;
        --r1900: #89dceb;
        --r2100: #cba6f7;
        --r2400: #fab387;
        --r3000: #f38ba8;
      }
      /* ═══ Gruvbox Dark ═══ */
      [data-theme="gruvbox"] {
        --bg: #282828;
        --surface: #3c3836;
        --surface2: #504945;
        --border: #665c54;
        --text: #ebdbb2;
        --subtext: #a89984;
        --accent: #83a598;
        --accent2: #fb4934;
        --teal: #8ec07c;
        --r900: #928374;
        --r1200: #a89984;
        --r1400: #b8bb26;
        --r1600: #8ec07c;
        --r1900: #83a598;
        --r2100: #d3869b;
        --r2400: #fe8019;
        --r3000: #fb4934;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      /* ═══ 滚动条主题化（Chrome/Edge 等 WebKit——filter 标签区/代码框/页面统一）═══ */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--surface2);
        border-radius: 5px;
        /* 无 border：Chrome 中 border 渲染成一圈黑色轮廓（Firefox 不应用 webkit 伪元素所以正常） */
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--border);
      }
      /* Firefox 滚动条主题化（原生属性，不产生黑圈） */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--surface2) transparent;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        padding: 20px;
        transition:
          background 0.3s,
          color 0.3s;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 4px;
      }
      h1 .accent {
        color: var(--accent);
      }
      .title-icon {
        width: 22px;
        height: 22px;
        vertical-align: -4px;
        margin-right: 6px;
      }
      .sub {
        color: var(--subtext);
        font-size: 13px;
        margin-bottom: 16px;
        min-height: 20px; /* 冗余高度：中英切换不影响布局 */
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
      }
      .theme-btn {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px 14px;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 13px;
      }
      .theme-btn:hover {
        border-color: var(--accent);
      }
      .topbar-btns {
        display: flex;
        gap: 10px;
      }
      #theme-btn {
        width: 118px; /* 冗余宽度：不受「🎨 Theme/🎨 主题」长度影响 */
      }

      /* 后台内容更新进度条 */
      .progress-bar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 14px;
        margin: 10px 0;
        font-size: 13px;
        color: var(--subtext);
        display: none;
        align-items: center;
        gap: 10px;
        min-height: 40px; /* 冗余高度：中英切换不影响布局 */
      }
      .progress-bar.show {
        display: flex;
      }
      .progress-track {
        flex: 1;
        height: 6px;
        background: var(--surface2);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.5s;
      }

      .filter-actions {
        grid-column: 1 / -1;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin: 0;
      }
      .filters {
        background: var(--surface);
        border-radius: var(--radius);
        padding: 14px;
        margin: 14px 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
        align-items: end;
        border: 1px solid var(--border);
      }
      .filters label {
        display: block;
        font-size: 12px;
        color: var(--subtext);
        margin-bottom: 4px;
        white-space: nowrap; /* 防中英切换换行 */
        height: 16px; /* 固定高度：中英文字行高差异不影响 */
        line-height: 16px;
        overflow: hidden;
      }
      .filters > div {
        min-height: 58px; /* 冗余高度：中英切换不影响整体高度 */
      }
      .filters > .filter-actions {
        min-height: 24px;
      }
      /* 数字输入框去掉上下增减按钮（Chrome/Edge spin button + Firefox 原生） */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
      }
      .filters input,
      .filters select {
        width: 100%;
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 9px;
        font-size: 13px;
        height: 34px; /* 固定高度：中英占位符/选项不影响组件尺寸 */
      }
      .filters input:focus,
      .filters select:focus {
        outline: none;
        border-color: var(--accent);
      }
      .reset-btn {
        width: 100%;
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 9px;
        font-size: 13px;
        cursor: pointer;
      }
      .reset-btn:hover {
        border-color: var(--accent);
      }
      .tag-chips {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-height: 84px;
        overflow-y: auto;
      }
      .chip {
        background: var(--surface2);
        color: var(--subtext);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }
      .chip.on {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
        font-weight: 600;
      }
      .stats-line {
        color: var(--subtext);
        font-size: 13px;
        margin-bottom: 10px;
        min-height: 20px; /* 冗余高度：中英切换不影响布局 */
      }
      .stats-line b {
        color: var(--accent);
      }
      .reset-btn.mini {
        position: static;
        flex: 0 0 88px;
        width: 88px; /* 固定宽度：Default/默认 切换不变 */
        text-align: center;
        height: 24px; /* 固定高度：中英字体行高差异不影响 */
        line-height: 22px;
        padding: 0 9px;
        font-size: 12px;
        border-radius: 5px;
        background: transparent;
        color: var(--subtext);
      }
      .reset-btn.mini.rebuild-btn {
        flex-basis: 138px;
        width: 138px;
      }
      .reset-btn.mini:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      .reset-btn.mini:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .rebuild-dialog {
        width: min(760px, calc(100vw - 32px));
        margin: auto;
        padding: 0;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      .rebuild-dialog::backdrop {
        background: rgba(0, 0, 0, 0.62);
        backdrop-filter: blur(3px);
      }
      .rebuild-dialog-card {
        padding: 22px;
      }
      .rebuild-dialog-title {
        margin: 0 0 10px;
        color: var(--text);
        font-size: 18px;
        line-height: 1.3;
      }
      .rebuild-dialog-message {
        margin: 0;
        color: var(--subtext);
        font-size: 14px;
        line-height: 1.55;
        white-space: pre-line;
      }
      .rebuild-preview {
        margin-top: 16px;
        padding: 12px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .rebuild-preview-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        margin-bottom: 10px;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
      }
      .rebuild-preview-summary span {
        white-space: nowrap;
      }
      .rebuild-preview-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }
      .rebuild-preview-tab {
        padding: 7px 10px;
        color: var(--subtext);
        background: transparent;
        border: 0;
        border-bottom: 2px solid transparent;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .rebuild-preview-tab:hover,
      .rebuild-preview-tab:focus-visible {
        color: var(--text);
        outline: none;
      }
      .rebuild-preview-tab[aria-selected="true"] {
        color: var(--accent);
        border-bottom-color: var(--accent);
        font-weight: 700;
      }
      .rebuild-preview-panel {
        max-height: 280px;
        overflow-y: auto;
        padding: 4px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .rebuild-preview-item {
        display: block;
        width: 100%;
        padding: 7px 9px;
        color: var(--text);
        background: transparent;
        border: 0;
        border-radius: 4px;
        font: inherit;
        font-size: 13px;
        line-height: 1.35;
        text-align: left;
        cursor: pointer;
      }
      .rebuild-preview-item:hover,
      .rebuild-preview-item:focus-visible {
        background: var(--surface2);
        outline: none;
      }
      .rebuild-preview-empty {
        padding: 12px 9px;
        color: var(--subtext);
        font-size: 13px;
      }
      .rebuild-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 22px;
      }
      .rebuild-dialog-button {
        min-width: 88px;
        padding: 8px 14px;
        color: var(--text);
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }
      .rebuild-dialog-button:hover,
      .rebuild-dialog-button:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      .rebuild-dialog-button.primary {
        color: var(--bg);
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 700;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border-radius: var(--radius);
        overflow: hidden;
      }
      thead th {
        text-align: left;
        padding: 10px 12px;
        font-size: 12px;
        color: var(--subtext);
        background: var(--surface2);
        white-space: nowrap;
        height: 38px; /* 固定高度（table-cell 语义=最小高度）：中英切换不影响表头 */
        vertical-align: middle;
      }
      tbody tr {
        border-top: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.15s;
      }
      tbody tr:hover {
        background: var(--surface2);
      }
      td {
        padding: 9px 12px;
        font-size: 13px;
        vertical-align: middle;
        line-height: 24px; /* 冗余行高：内容行盒富余，垂直位置稳定 */
      }
      tbody tr {
        height: 44px; /* 冗余行高（9px×2 + 24px + 2px 富余）：行内字符上下位置不受语言/字体度量影响 */
      }
      .id {
        font-family: monospace;
        color: var(--accent);
        white-space: nowrap;
        width: 96px; /* 冗余宽度：列宽固定，不受 ID 长度影响 */
      }
      .link-td {
        width: 88px; /* 冗余宽度：不受「打开 ↗/Open ↗」长度影响 */
        white-space: nowrap;
      }
      .link-td .link {
        display: inline-block;
        width: 72px; /* 固定宽度：中英链接文字位置稳定 */
      }
      /* ═══ 本地解题代码复制按钮（与 srcdoc 样例框同逻辑）═══ */
      .copy-wrap {
        position: relative;
      }
      .copy-btn {
        position: absolute;
        top: 6px;
        right: 8px;
        z-index: 5;
        font:
          14px "CodeNewRoman Nerd Font",
          var(--sans);
        color: var(--accent);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        width: 24px;
        height: 24px;
        padding: 0;
        line-height: 24px;
        text-align: center;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s;
        user-select: none;
        box-sizing: border-box;
      }
      .copy-wrap:hover .copy-btn,
      .copy-btn:focus {
        opacity: 1;
      }
      .copy-btn:hover {
        color: var(--text);
        background: var(--surface2);
        border-color: var(--border);
      }
      .copy-btn.ok {
        color: var(--teal);
        border-color: var(--border);
      }
      .name {
        max-width: 340px;
      }
      .rating {
        font-weight: 700;
        white-space: nowrap;
        width: 80px; /* 冗余宽度：不受「800/3500/—」长度影响 */
      }
      .solved {
        font-family: monospace;
        white-space: nowrap;
      }
      .tags-td {
        max-width: 380px;
      }
      .tags-wrap {
        display: flex;
        align-items: center; /* 中心对齐：不依赖字体基线/x-height，零抖动 */
        flex-wrap: wrap;
        gap: 6px;
        height: 100%;
      }
      .mini-tag {
        display: inline-block;
        font-size: 11px;
        color: var(--subtext);
        line-height: 1;
      }
      .link {
        color: var(--accent);
        text-decoration: none;
        font-size: 12px;
      }
      .link:hover {
        text-decoration: underline;
      }
      .empty {
        text-align: center;
        color: var(--subtext);
        padding: 40px;
      }

      .pager {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .pager button {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
      }
      .pager button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .pager button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .pager .cur {
        background: var(--accent);
        color: var(--bg);
        font-weight: 700;
        border-color: var(--accent);
      }
      .pager .info {
        color: var(--subtext);
        font-size: 12px;
      }

      /* ═══ 详情视图（新页面式）═══ */
      #detail-view {
        display: none;
        max-width: 1200px;
        margin: 0 auto;
      }
      #detail-view.show {
        display: block;
      }
      .detail-bar {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 16px;
        margin-bottom: 18px;
      }
      .back-btn {
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 14px;
        cursor: pointer;
        font-size: 13px;
        height: 34px; /* 固定高度：中英文字行高差异不影响 */
        line-height: 20px;
        width: 116px; /* 固定宽度：← Back / ← 返回 切换不影响后续元素位置 */
        text-align: center;
      }
      /* SVG 箭头：几何渲染，不依赖字体字形（Chrome 的 ← 字形基线偏移问题） */
      .back-arrow {
        width: 12px;
        height: 12px;
        vertical-align: -1px;
        margin-right: 5px;
        display: inline-block;
      }
      .back-btn:hover {
        border-color: var(--accent);
      }
      .detail-title {
        font-size: 16px;
        font-weight: 600;
        flex: 1;
        min-width: 200px;
      }
      .detail-meta {
        font-size: 12px;
        color: var(--subtext);
        max-width: 340px;
        white-space: nowrap; /* 单行：中英长度差异不引发换行/高度变化 */
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-shrink: 0; /* 不被压缩：英文按钮文字保持一行 */
      }
      .tab {
        background: var(--surface2);
        color: var(--subtext);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 18px;
        cursor: pointer;
        font-size: 13px;
        height: 34px; /* 固定高度：中英文字行高差异不影响 */
        line-height: 20px;
        width: 140px; /* 固定宽度：📄 Statement / 📄 题面 都容纳，中英切换不变 */
        text-align: center;
        white-space: nowrap; /* 按钮内文字不换行 */
      }
      .tab.on {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
        font-weight: 600;
      }

      /* 阅读区：居中窄栏，衬线排版，无内部滚动条（高度自适应） */
      .reader {
        max-width: 1200px; /* 与上方 detail-bar 同宽对齐 */
        margin: 0 auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px 34px;
      }
      .reader .hint {
        color: var(--subtext);
        text-align: center;
        padding: 50px 0;
        font-size: 14px;
        line-height: 2;
      }
      .statement-frame {
        width: 100%;
        border: none;
        display: block;
        background: transparent;
        min-height: 420px;
      }
      /* ═══ 代码高亮主题（CSS 变量 → 自动跟随 catppuccin/gruvbox）═══ */
      .hljs {
        background: transparent;
        color: var(--text);
      }
      .hljs-keyword,
      .hljs-selector-tag,
      .hljs-literal {
        color: var(--accent2);
      }
      .hljs-string,
      .hljs-regexp,
      .hljs-addition {
        color: var(--teal);
      }
      .hljs-number,
      .hljs-symbol,
      .hljs-bullet {
        color: var(--r2400);
      }
      .hljs-comment,
      .hljs-quote {
        color: var(--subtext);
        font-style: italic;
      }
      .hljs-title,
      .hljs-function,
      .hljs-title.function_,
      .hljs-section {
        color: var(--accent);
      }
      .hljs-type,
      .hljs-built_in,
      .hljs-attr,

    </style>
  </head>
  <body>
    <!-- ═══ 列表视图 ═══ -->
    <div class="container" id="list-view">

          stageError: "异常",
          stageIdle: "空闲",
          progress:
            "{stage}：{done}/{total}（已爬 {fetched}，已有 {cached}，失败 {failed}）",
          detailMeta: "分数: {r} · 解题: {s} · {tags}",
          readerLoading: "加载中...",
          contentPending: "正在爬取该内容，完成后会自动显示。",
          noStatement: "暂时没有可用题面。",
          loadFail: "加载失败：",
          noEditorialKnown: "该比赛没有公开的 Editorial（官方未发布题解）。",
          noEditorialUnknown: "暂时没有可用题解，爬虫会自动重试。",
          editorialFail: "题解加载失败：",
          mySolutions: "💻 我的解题代码",
          openProblem: "在 Codeforces 打开原题",
          openTop: "打开 ↗",
          imgMissing: "🖼️ 图片未加载",
          langName: {
            rs: "Rust",
            cpp: "C++",
            cc: "C++",
            cxx: "C++",
            c: "C",
            py: "Python",
            java: "Java",
            go: "Go",
            ts: "TypeScript",
            js: "JavaScript",
            kt: "Kotlin",
          },
        },
      };
      function t(key) {
        return (I18N[lang] || I18N.en)[key] ?? I18N.en[key] ?? key;
      }
      function toggleLang() {
        lang = lang === "en" ? "zh" : "en";
        try {
          localStorage.setItem("cfdb-lang", lang);
        } catch (e) {}
        applyI18n();
      }
      function applyI18n() {
        document.title = t("title");
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
        // 语言按钮：显示「将要切换到的语言」（英文界面→文，中文界面→En）
        const lb = document.getElementById("lang-btn");
        if (lb) lb.textContent = lang === "en" ? "文" : "En";
        // 计数器：已加载显示统计，未加载显示 loading（避免被静态替换覆盖）
        if (ALL.length) {
          const rated = ALL.filter((p) => p.rating).length;
          $("total-line").textContent = t("totalLine")
            .replace("{n}", ALL.length)
            .replace("{r}", rated);
        } else {
          $("total-line").textContent = t("loading");
        }
        document.querySelectorAll("[data-i18n-title]").forEach((el) => {
          el.title = t(el.dataset.i18nTitle);
        });
        document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
          el.placeholder = t(el.dataset.i18nPh);
        });
        document.querySelectorAll("[data-i18n-opt]").forEach((el) => {
          el.textContent = t(el.dataset.i18nOpt);
        });
        if (currentProblem) {
          rebuildDetail();
        } else {
          render();
        }
      }
      function rebuildDetail() {
        if (!currentProblem) return;
        $("detail-title").textContent =
          `${currentProblem.contestId}${currentProblem.index} — ${currentProblem.name}`;
        $("detail-meta").textContent = t("detailMeta")
          .replace("{r}", currentProblem.rating ?? "—")
          .replace("{s}", fmt(currentProblem.solvedCount))
          .replace("{tags}", currentProblem.tags.join(" / "));
        const reader = $("reader");
        reader.replaceChildren();
        if (tabCache[currentTab]) {
          reader.appendChild(contentFrame(tabCache[currentTab]));
          if (currentTab === "statement") renderSolutions(reader);
        } else {
          loadTab(currentTab);
        }
      }

      let ALL = [],
        FILTERED = [];
      const PAGE = 50;
      let page = 1;
      const activeTags = new Set();
      let restorePage = 1;

      /* 筛选状态持久化到 URL 参数（刷新/滚动天然保留，无写入竞态） */
      function saveState() {
        try {
          const p = new URLSearchParams();
          if ($("f-rmin").value) p.set("rmin", $("f-rmin").value);
          if ($("f-rmax").value) p.set("rmax", $("f-rmax").value);
          if ($("f-solved").value) p.set("solved", $("f-solved").value);
          if ($("f-search").value) p.set("search", $("f-search").value);
          if ($("f-sort").value !== "id-asc") p.set("sort", $("f-sort").value);
          if (activeTags.size) p.set("tags", [...activeTags].join(","));
          if (page > 1) p.set("page", page);
          const qs = p.toString();
          const url = location.pathname + (qs ? "?" + qs : "") + location.hash;
          history.replaceState(null, "", url); // 不产生历史记录
        } catch (e) {}
      }
      function restoreState() {
        try {
          const p = new URLSearchParams(location.search);
          $("f-rmin").value = p.get("rmin") || "";
          $("f-rmax").value = p.get("rmax") || "";
          $("f-solved").value = p.get("solved") || "";
          $("f-search").value = p.get("search") || "";
          $("f-sort").value = p.get("sort") || "id-asc";
          activeTags.clear();
          const tags = p.get("tags");
          if (tags) tags.split(",").forEach((t) => activeTags.add(t));
          restorePage = parseInt(p.get("page")) || 1;
        } catch (e) {}
      }

      let currentProblem = null;
      let tabCache = {}; // { 'statement': {md, html} | null, 'editorial': ... }
      let currentTab = "statement";
      let loadSeq = 0; // 加载请求序列号：切 tab/切题后旧响应直接丢弃（防竞态覆盖）

      const $ = (id) => document.getElementById(id);
      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }

      /* ═══ 数据加载 ═══ */
      async function load() {
        try {
          const r = await fetch("/api/problems");
          ALL = await r.json();
          const rated = ALL.filter((p) => p.rating).length;
          $("total-line").textContent = t("totalLine")
            .replace("{n}", ALL.length)
            .replace("{r}", rated);
          restoreState();
          buildTagChips();
          apply();
          page = restorePage; // 恢复页码（apply 会重置为 1）
          render();
          pollProgress();
        } catch (err) {
          $("total-line").textContent = t("loadFail") + err;
        }
      }

      /* ═══ 后台内容更新进度 ═══ */
      const STAGE_CN = {
        meta: "stageMeta",
        content: "stageContent",
        statements: "stageStatements",
        editorials: "stageEditorials",
        done: "stageDone",
        error: "stageError",
        idle: "stageIdle",
      };
      let lastDone = -1;
      let lastRefresh = 0;
      let rebuildInFlight = false;
      let rebuildRequestVersion = 0;
      let rebuildRequestPending = false;

      /* 静默刷新题目数据（不重置筛选/页码），让列表标记自动更新 */
      async function refreshData() {
        try {
          const r = await fetch("/api/problems");
          ALL = await r.json();
          const savedPage = page;
          apply();
          page = savedPage;
          render();
        } catch (e) {}
      }

      async function pollProgress() {
        const pollVersion = rebuildRequestVersion;
        const pollStartedPending = rebuildRequestPending;
        try {
          const r = await fetch("/api/progress");
          const s = await r.json();
          const bar = $("progress-bar");
          if (s.stage === "idle" || s.stage === "done") {
            bar.classList.remove("show");
          } else {
            bar.classList.add("show");
            $("progress-text").textContent = t("progress")
              .replace("{stage}", t(STAGE_CN[s.stage] || s.stage))
              .replace("{done}", s.done)
              .replace("{total}", s.total)
              .replace("{fetched}", s.fetched)
              .replace("{cached}", s.cached)
              .replace("{failed}", s.failed);
            $("progress-fill").style.width = s.total
              ? (s.done / s.total) * 100 + "%"
              : "0%";
          }
          // 进度推进或后台更新结束 → 自动刷新列表标记（节流 10s）
          const busy =
            s.stage === "meta" ||
            s.stage === "content" ||
            s.stage === "statements" ||
            s.stage === "editorials";
          const rebuildButton = $("rebuild-btn");
          if (
            rebuildButton &&
            !busy &&
            pollVersion === rebuildRequestVersion &&
            !pollStartedPending
          ) {
            rebuildInFlight = false;
            rebuildButton.disabled = false;
          }
          if (s.done !== lastDone || (busy === false && lastDone !== -1)) {
            const now = Date.now();
            if (now - lastRefresh > 10000) {
              lastRefresh = now;
              refreshData();
            }
          }
          lastDone = s.done;
        } catch (e) {}
        setTimeout(pollProgress, 2000);
      }

      /* ═══ 标签筛选 ═══ */
      function buildTagChips() {
        const counts = {};
        for (const p of ALL)
          for (const t of p.tags) counts[t] = (counts[t] || 0) + 1;
        const box = $("tag-chips");
        box.replaceChildren();
        Object.entries(counts)
          .sort((a, b) => b[1] - a[1])
          .forEach(([t, c]) => {
            const chip = el("span", "chip", `${t} (${c})`);
            chip.dataset.tag = t;
            if (activeTags.has(t)) chip.classList.add("on"); // 恢复选中
            chip.onclick = () => toggleTag(chip);
            box.appendChild(chip);
          });
      }
      function toggleTag(chip) {
        const t = chip.dataset.tag;
        if (activeTags.has(t)) {
          activeTags.delete(t);
          chip.classList.remove("on");
        } else {
          activeTags.add(t);
          chip.classList.add("on");
        }
        apply();
        saveState(); // 标签变化即保存
      }

      function selectRebuildPreviewTab(kind) {
        const statements = kind === "statements";
        const statementTab = $("rebuild-preview-tab-statements");
        const editorialTab = $("rebuild-preview-tab-editorials");
        const statementPanel = $("rebuild-preview-panel-statements");
        const editorialPanel = $("rebuild-preview-panel-editorials");
        statementTab.setAttribute("aria-selected", String(statements));
        editorialTab.setAttribute("aria-selected", String(!statements));
        statementPanel.hidden = !statements;
        editorialPanel.hidden = statements;
      }

      function openRebuildPreviewItem(kind, contentId) {
        const problem = ALL.find((item) =>
          kind === "statements"
            ? String(item.id) === contentId
            : String(item.contestId) === contentId,
        );
        if (!problem) return;
        const dialog = $("rebuild-dialog");
        if (dialog.open) dialog.close("navigate");
        showDetail(problem);
        if (kind === "editorials") switchTab("editorial");
      }

      function renderRebuildPreviewGroup(kind, items) {
        const list = $(`rebuild-preview-list-${kind}`);
        list.replaceChildren();
        if (!items.length) {
          list.appendChild(
            el("div", "rebuild-preview-empty", t("rebuildPreviewEmpty")),
          );
          return;
        }
        for (const item of items) {
          if (!item || typeof item.id !== "string") continue;
          const row = document.createElement("button");
          row.type = "button";
          row.className = "rebuild-preview-item";
          row.textContent =
            typeof item.label === "string" && item.label ? item.label : item.id;
          row.onclick = () => openRebuildPreviewItem(kind, item.id);
          list.appendChild(row);
        }
        if (!list.childElementCount) {
          list.appendChild(
            el("div", "rebuild-preview-empty", t("rebuildPreviewEmpty")),
          );
        }
      }

      function renderRebuildPreview(preview) {
        const statements =
          preview &&
          preview.statements &&
          Array.isArray(preview.statements.items)
            ? preview.statements.items
            : [];
        const editorials =
          preview &&
          preview.editorials &&
          Array.isArray(preview.editorials.items)
            ? preview.editorials.items
            : [];
        $("rebuild-preview-statements-summary").textContent =
          `${t("rebuildStatements")}: ${statements.length}`;
        $("rebuild-preview-editorials-summary").textContent =
          `${t("rebuildEditorials")}: ${editorials.length}`;
        $("rebuild-preview-tab-statements").textContent =
          `${t("rebuildStatements")} (${statements.length})`;
        $("rebuild-preview-tab-editorials").textContent =
          `${t("rebuildEditorials")} (${editorials.length})`;
        renderRebuildPreviewGroup("statements", statements);
        renderRebuildPreviewGroup("editorials", editorials);
        selectRebuildPreviewTab("statements");
        $("rebuild-preview").hidden = false;
        $("rebuild-dialog-confirm").disabled =
          statements.length + editorials.length === 0;
      }

      function clearRebuildPreview() {
        renderRebuildPreview({
          statements: { items: [] },
          editorials: { items: [] },
        });
      }

      function showRebuildDialog({ title, message, mode, trigger, preview }) {
        const dialog = $("rebuild-dialog");
        const titleNode = $("rebuild-dialog-title");
        const messageNode = $("rebuild-dialog-message");
        const previewNode = $("rebuild-preview");
        const cancelButton = $("rebuild-dialog-cancel");
        const confirmButton = $("rebuild-dialog-confirm");
        const closeButton = $("rebuild-dialog-close");
        const confirmation = mode === "confirm";

        titleNode.textContent = title;
        messageNode.textContent = message;
        cancelButton.hidden = !confirmation;
        confirmButton.hidden = !confirmation;
        closeButton.hidden = confirmation;
        confirmButton.disabled = false;
        previewNode.hidden = !(confirmation && preview);
        if (confirmation && preview) renderRebuildPreview(preview);
        dialog.returnValue = "";

        return new Promise((resolve) => {
          dialog.addEventListener(
            "close",
            () => {
              if (
                trigger &&
                !trigger.disabled &&
                typeof trigger.focus === "function"
              ) {
                trigger.focus();
              }
              resolve(dialog.returnValue === "confirm");
            },
            { once: true },
          );
          dialog.showModal();
          (confirmation ? cancelButton : closeButton).focus();
        });
      }

      async function fetchRebuildPreview() {
        const response = await fetch("/api/rebuild/preview");
        let payload = null;
        try {
          payload = await response.json();
        } catch (e) {}
        if (
          !response.ok ||
          !payload ||
          payload.status !== "ready" ||
          !payload.statements ||
          !payload.editorials
        ) {
          throw new Error("rebuild-preview-failed");
        }
        return payload;
      }

      async function requestRebuild(button) {
        rebuildRequestVersion += 1;
        rebuildRequestPending = true;
        rebuildInFlight = true;
        button.disabled = true;
        let accepted = false;
        let preview;
        try {
          preview = await fetchRebuildPreview();
        } catch (e) {
          await showRebuildDialog({
            title: t("rebuildDialogTitle"),
            message: t("rebuildPreviewFailed"),
            mode: "status",
            trigger: button,
          });
          rebuildRequestPending = false;
          rebuildInFlight = false;
          button.disabled = false;
          return;
        }

        try {
          const statementItems =
            preview &&
            preview.statements &&
            Array.isArray(preview.statements.items)
              ? preview.statements.items
              : [];
          const editorialItems =
            preview &&
            preview.editorials &&
            Array.isArray(preview.editorials.items)
              ? preview.editorials.items
              : [];
          if (statementItems.length + editorialItems.length === 0) {
            rebuildRequestPending = false;
            rebuildInFlight = false;
            button.disabled = false;
            await showRebuildDialog({
              title: t("pendingCrawlList"),
              message: t("pendingCrawlClean"),
              mode: "status",
              trigger: button,
            });
            return;
          }
          const confirmed = await showRebuildDialog({
            title: t("rebuildDialogTitle"),
            message: t("rebuildConfirm"),
            mode: "confirm",
            trigger: button,
            preview,
          });
          if (!confirmed) return;

          const response = await fetch("/api/rebuild", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ confirm: true }),
          });
          let payload = null;
          try {
            payload = await response.json();
          } catch (e) {}
          const operation = payload && payload.operation;
          if (
            !response.ok ||
            !payload ||
            payload.status !== "accepted" ||
            (operation !== "started" && operation !== "already_running")
          ) {
            await showRebuildDialog({
              title: t("rebuildDialogTitle"),
              message: t("rebuildFailed"),
              mode: "status",
              trigger: button,
            });
          } else {
            accepted = true;
            rebuildRequestPending = false;
            clearRebuildPreview();
            await showRebuildDialog({
              title: t("rebuildDialogTitle"),
              message: t(
                operation === "already_running"
                  ? "rebuildAlreadyRunning"
                  : "rebuildStarted",
              ),
              mode: "status",
              trigger: button,
            });
          }
        } catch (e) {
          await showRebuildDialog({
            title: t("rebuildDialogTitle"),
            message: t("rebuildFailed"),
            mode: "status",
            trigger: button,
          });
        } finally {
          if (!accepted) {
            rebuildRequestPending = false;
            rebuildInFlight = false;
            button.disabled = false;
          }
        }
      }

      /* 恢复默认筛选 */
      function resetFilters() {
        $("f-rmin").value = "";
        $("f-rmax").value = "";
        $("f-solved").value = "";
        $("f-search").value = "";
        $("f-sort").value = "id-asc";
        activeTags.clear();
        document
          .querySelectorAll(".tag-chips .chip.on")
          .forEach((c) => c.classList.remove("on"));
        restorePage = 1;
        try {
          history.replaceState(null, "", location.pathname + location.hash);
        } catch (e) {}
        apply();
      }

      /* ═══ 筛选 + 排序 ═══ */
      function apply() {
        const rmin = parseInt($("f-rmin").value) || 0;
        const rmax = parseInt($("f-rmax").value) || 99999;
        const solved = parseInt($("f-solved").value) || 0;
        const q = $("f-search").value.trim().toLowerCase();
        const sort = $("f-sort").value;

        FILTERED = ALL.filter((p) => {
          if (p.rating && (p.rating < rmin || p.rating > rmax)) return false;
          if (!p.rating && rmin > 0) return false;
          if (p.solvedCount < solved) return false;
          if (activeTags.size && !p.tags.some((t) => activeTags.has(t)))
            return false;
          if (
            q &&
            !(
              p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)
            )
          )
            return false;
          return true;
        });

        const cmp = {
          "rating-desc": (a, b) => (b.rating || -1) - (a.rating || -1),
          "rating-asc": (a, b) => (a.rating || 99999) - (b.rating || 99999),
          "solved-desc": (a, b) => b.solvedCount - a.solvedCount,
          "solved-asc": (a, b) => a.solvedCount - b.solvedCount,
          "id-asc": (a, b) =>
            a.contestId - b.contestId || a.index.localeCompare(b.index),
          "id-desc": (a, b) =>
            b.contestId - a.contestId || b.index.localeCompare(a.index),
          "name-asc": (a, b) => a.name.localeCompare(b.name),
        }[sort];
        FILTERED.sort(cmp);
        page = 1;
        render();
      }

      /* ═══ 列表渲染 ═══ */
      function ratingColor(r) {
        if (!r) return "var(--subtext)";
        if (r < 1200) return "var(--r900)";
        if (r < 1400) return "var(--r1200)";
        if (r < 1600) return "var(--r1400)";
        if (r < 1900) return "var(--r1600)";
        if (r < 2100) return "var(--r1900)";
        if (r < 2400) return "var(--r2100)";
        if (r < 3000) return "var(--r2400)";
        return "var(--r3000)";
      }
      function fmt(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
        if (n >= 1000) return (n / 1000).toFixed(1) + "k";
        return String(n);
      }
      function render() {
        const line = $("stats-line");
        line.replaceChildren();
        line.appendChild(el("span", null, t("filtered")));
        const b = el("b", null, String(FILTERED.length));
        line.appendChild(b);
        line.appendChild(el("span", null, t("problems")));

        const totalPages = Math.max(1, Math.ceil(FILTERED.length / PAGE));
        if (page > totalPages) page = totalPages;
        const slice = FILTERED.slice((page - 1) * PAGE, page * PAGE);

        const tb = $("tbody");
        tb.replaceChildren();
        if (!slice.length) {
          const tr = el("tr");
          const td = el("td", "empty", t("noMatch"));
          td.colSpan = 6;
          tr.appendChild(td);
          tb.appendChild(tr);
        }
        for (const p of slice) {
          const tr = el("tr");
          tr.onclick = () => showDetail(p);
          const idTd = el("td", "id", `${p.contestId}${p.index}`);
          const nameTd = el("td", "name", p.name);
          if (p.hasSolution) {
            // 已有解题代码：主题蓝绿色标识
            idTd.style.color = "var(--teal)";
            nameTd.style.color = "var(--teal)";
            nameTd.style.fontWeight = "600";
            tr.title = t("solvedBadge");
          }
          tr.appendChild(idTd);
          tr.appendChild(nameTd);
          const rd = el("td", "rating", p.rating ? String(p.rating) : "—");
          rd.style.color = ratingColor(p.rating);
          tr.appendChild(rd);
          tr.appendChild(el("td", "solved", fmt(p.solvedCount)));
          const tagsTd = el("td", "tags-td");
          const tagsWrap = el("div", "tags-wrap");
          p.tags
            .slice(0, 4)
            .forEach((t) => tagsWrap.appendChild(el("span", "mini-tag", t)));
          tagsTd.appendChild(tagsWrap);
          tr.appendChild(tagsTd);
          const linkTd = el("td", "link-td");
          const a = el("a", "link", t("open"));
          a.href = p.url;
          a.target = "_blank";
          a.onclick = (e) => e.stopPropagation();
          linkTd.appendChild(a);
          tr.appendChild(linkTd);
          tb.appendChild(tr);
        }

        const pager = $("pager");
        pager.replaceChildren();
        const mkBtn = (label, fn, disabled) => {
          const b = el("button", null, label);
          b.disabled = !!disabled;
          b.onclick = fn;
          pager.appendChild(b);
          return b;
        };
        mkBtn("«", () => go(1), page === 1);
        mkBtn("‹", () => go(page - 1), page === 1);
        for (
          let i = Math.max(1, page - 2);
          i <= Math.min(totalPages, page + 2);
          i++
        ) {
          const b = mkBtn(String(i), () => go(i), false);
          if (i === page) b.classList.add("cur");
        }
        mkBtn("›", () => go(page + 1), page === totalPages);
        mkBtn("»", () => go(totalPages), page === totalPages);
        pager.appendChild(el("span", "info", `${page}/${totalPages}`));
      }
      function go(n) {
        page = n;
        render();
        saveState(); // 翻页保存页码（刷新后恢复）
      }

      const RETRYABLE_CONTENT_STATUSES = new Set([
        "pending",
        "transient_failure",
        "invalid_structure",
        "invalid_ref",
      ]);
      const prioritySignals = new Map();

      async function prioritizeUnavailableContent(contentKind, payload) {
        if (
          !currentProblem ||
          !payload ||
          payload.body != null ||
          !RETRYABLE_CONTENT_STATUSES.has(payload.status)
        ) {
          return false;
        }
        if (contentKind !== "statement" && contentKind !== "editorial") {
          return false;
        }
        const contentId =
          contentKind === "statement"
            ? `${currentProblem.contestId}${currentProblem.index}`
            : String(currentProblem.contestId);
        const key = `${contentKind}:${contentId}`;
        if (prioritySignals.has(key)) return false;
        const signalToken = {};
        prioritySignals.set(key, signalToken);
        try {
          const response = await fetch("/api/prioritize", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ kind: contentKind, contentId }),
          });
          if (!response.ok) throw new Error("priority request failed");
          return true;
        } catch (e) {
          if (prioritySignals.get(key) === signalToken) {
            prioritySignals.delete(key);
          }
          return false;
        }
      }

      /* ═══ 视图切换 ═══ */
      function showDetail(p) {
        if (location.hash !== "#/problem/" + p.id) {
          try {
            history.pushState(null, "", "#/problem/" + p.id);
          } catch (e) {}
        }
        currentProblem = p;
        prioritySignals.clear();
        tabCache = {};
        currentTab = "statement";
        $("list-view").style.display = "none";
        $("detail-view").classList.add("show");
        $("detail-title").textContent = `${p.contestId}${p.index} — ${p.name}`;
        $("detail-meta").textContent = t("detailMeta")
          .replace("{r}", p.rating ?? "—")
          .replace("{s}", fmt(p.solvedCount))
          .replace("{tags}", p.tags.join(" / "));
        $("tab-statement").classList.add("on");
        $("tab-editorial").classList.remove("on");
        loadTab("statement");
      }
      /* 按钮返回 = 浏览器后退（同一套 popstate 逻辑） */
      function goBack() {
        history.back();
        // 兜底：直接打开详情 URL（无历史可退）时，back 无效 → 手动回列表
        setTimeout(() => {
          if (location.hash.startsWith("#/problem/")) showList();
        }, 120);
      }
      function showList() {
        try {
          // 保留 search（filter 参数）——只清 #/problem/ 详情 hash，
          // 否则返回列表后刷新 filter 全部丢失
          history.replaceState(null, "", location.pathname + location.search);
        } catch (e) {}
        loadSeq++; // 离开详情页：所有在途请求作废
        currentProblem = null;
        $("detail-view").classList.remove("show");
        $("list-view").style.display = "";
      }

      /* ═══ 标签页：题面 / 题解 ═══ */
      function switchTab(tab) {
        if (tab === currentTab) return;
        currentTab = tab;
        $("tab-statement").classList.toggle("on", tab === "statement");
        $("tab-editorial").classList.toggle("on", tab === "editorial");
        loadTab(tab);
      }
      function retryPendingContent(tab, seq) {
        setTimeout(() => {
          if (seq === loadSeq && currentProblem && currentTab === tab) {
            loadTab(tab);
          }
        }, 2000);
      }
      function loadTab(tab) {
        if (!currentProblem) return;
        const seq = ++loadSeq; // 本次加载请求的序列号
        const reader = $("reader");
        reader.replaceChildren();
        if (tabCache[tab]) {
          reader.appendChild(contentFrame(tabCache[tab]));
          // 缓存恢复也要渲染题面底部的解题代码
          if (tab === "statement") renderSolutions(reader, seq);
          return;
        }
        reader.appendChild(el("div", "hint", t("readerLoading")));
        if (tab === "editorial") {
          loadEditorial(reader, seq);
          return;
        }
        fetch(
          `/api/statement?contestId=${currentProblem.contestId}&index=${currentProblem.index}`,
        )
          .then((r) => r.json())
          .then((d) => {
            if (seq !== loadSeq) return; // 已切走（tab/题目变了），丢弃过期响应
            reader.replaceChildren();
            const payload = CFDBReaderPayload.normalizeApiPayload(d);
            prioritizeUnavailableContent("statement", payload);
            if (!payload || payload.body == null) {
              let message = t("noStatement");
              if (payload && payload.status === "pending") {
                message = t("contentPending");
                retryPendingContent(tab, seq);
              } else if (payload && payload.status === "transient_failure") {
                message = t("contentPending");
                retryPendingContent(tab, seq);
              }
              const hint = el("div", "hint", message);
              hint.style.whiteSpace = "pre-line";
              reader.appendChild(hint);
              tabCache[tab] = null;
              return;
            }
            tabCache[tab] = payload;
            reader.appendChild(contentFrame(payload));
            // 题面底部渲染自己的解题代码（无则跳过，不渲染空框）
            renderSolutions(reader, seq);
          })
          .catch((err) => {
            if (seq !== loadSeq) return;
            const d = el("div", "hint", t("loadFail") + err);
            d.style.color = "var(--red)";
            reader.appendChild(d); // 追加提示，不清空题面
          });
      }

      /* ═══ CF 官方题解（只读 v2 API）═══ */
      function loadEditorial(reader, seq) {
        fetch(`/api/editorial?contestId=${currentProblem.contestId}`)
          .then((r) => r.json())
          .then((d) => {
            if (seq !== loadSeq) return; // 用户已切回题面/别的题，丢弃过期题解响应
            reader.replaceChildren();
            const payload = CFDBReaderPayload.normalizeApiPayload(d);
            prioritizeUnavailableContent("editorial", payload);
            if (!payload || payload.body == null) {
              let message = t("noEditorialUnknown");
              if (payload && payload.status === "pending") {
                message = t("contentPending");
                retryPendingContent("editorial", seq);
              } else if (payload && payload.status === "transient_failure") {
                message = t("contentPending");
                retryPendingContent("editorial", seq);
              } else if (payload && payload.known) {
                message = t("noEditorialKnown");
              }
              const hint = el("div", "hint", message);
              hint.style.whiteSpace = "pre-line";
              reader.appendChild(hint);
              return;
            }
            tabCache.editorial = payload;
            reader.appendChild(contentFrame(payload));
          })
          .catch((err) => {
            if (seq !== loadSeq) return;
            reader.replaceChildren();
            const d = el("div", "hint", t("editorialFail") + err);
            d.style.color = "var(--red)";
            reader.appendChild(d);
          });
      }

      /* ═══ hljs 高亮（轻量本地，语言映射 + 主题色联动）═══ */
      const langMap = {
        rs: "rust",
        cpp: "cpp",
        cc: "cpp",
        cxx: "cpp",
        c: "c",
        py: "python",
        java: "java",
        go: "go",
        ts: "typescript",
        js: "javascript",
        kt: "kotlin",
        cs: "csharp",
        sh: "bash",
        txt: "plaintext",
      };
      /* ═══ 解题代码渲染（题面底部追加；无文件则不渲染）═══ */
      /* 复制按钮（与 srcdoc 样例框相同逻辑）：clipboard → execCommand 双轨兼容 */
      function attachCopyButton(pre) {
        const wrap = el("div", "copy-wrap");
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);
        const btn = el("button", "copy-btn");
        btn.textContent = "\uf0c5";
        btn.title = "复制";
        btn.onclick = () => {
          const txt = pre.textContent;
          const flash = (ok) => {
            btn.textContent = ok ? "\uf00c" : "\uf0c5";
            if (ok) btn.classList.add("ok");
            setTimeout(() => {
              btn.textContent = "\uf0c5";
              btn.classList.remove("ok");
            }, 1500);
          };
          const fallback = () => {
            const ta = document.createElement("textarea");
            ta.value = txt;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try {
              ok = document.execCommand("copy");
            } catch (e) {}
            document.body.removeChild(ta);
            return ok;
          };
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(txt).then(
              () => flash(true),
              () => flash(fallback()),
            );
          } else {
            flash(fallback());
          }
        };
        wrap.appendChild(btn);
      }

      function renderSolutions(reader, seq) {
        fetch(
          `/api/solution?contestId=${currentProblem.contestId}&index=${currentProblem.index}`,
        )
          .then((r) => r.json())
          .then((d) => {
            if (seq !== loadSeq) return; // 已切走：不追加到错误的视图
            const files = d.files || [];
            if (!files.length) return; // 无代码：不渲染任何东西
            const head = el("h2", null, t("mySolutions"));
            head.style.margin = "30px 0 10px";
            head.style.color = "var(--accent)";
            reader.appendChild(head);
            const langName = (I18N[lang] || I18N.en).langName;
            files.forEach((f) => {
              const head = el(
                "h3",
                null,
                `${f.name}  (${langName[f.ext] || f.ext})`,
              );
              head.style.margin = "24px 0 10px";
              head.style.color = "var(--accent)";
              reader.appendChild(head);
              const pre = el("pre");
              pre.style.cssText =
                "background:var(--surface);border:1px solid var(--border);" +
                "border-radius:10px;padding:16px 18px;overflow:auto;" +
