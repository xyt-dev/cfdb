<!doctype html>
<html lang="zh-CN" data-theme="gruvbox">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/vendor/cf-favicon.png" />
    <title>Codeforces Database — Codeforces Problem Library</title>
    <script src="/vendor/marked.min.js"></script>
    <script src="/vendor/highlight.min.js"></script>
    <style>
      /* ═══ CodeNewRoman Nerd Font（本地，零 CDN）═══ */
      @font-face {
        font-family: "CodeNewRoman Nerd Font";
        src: url("/vendor/CodeNewRomanNerdFont-Regular.otf") format("opentype");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "CodeNewRoman Nerd Font";
        src: url("/vendor/CodeNewRomanNerdFont-Bold.otf") format("opentype");
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: "CodeNewRoman Nerd Font";
        src: url("/vendor/CodeNewRomanNerdFont-Italic.otf") format("opentype");
        font-weight: 400;
        font-style: italic;
      }
      @font-face {
        font-family: "CodeNewRoman Nerd Font Mono";
        src: url("/vendor/CodeNewRomanNerdFontMono-Regular.otf")
          format("opentype");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "CodeNewRoman Nerd Font Mono";
        src: url("/vendor/CodeNewRomanNerdFontMono-Bold.otf") format("opentype");
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: "CodeNewRoman Nerd Font Mono";
        src: url("/vendor/CodeNewRomanNerdFontMono-Italic.otf")
          format("opentype");
        font-weight: 400;
        font-style: italic;
      }
      :root {
        --radius: 10px;
        --sans:
          "CodeNewRoman Nerd Font", "Noto Sans SC", "PingFang SC", sans-serif;
        --serif:
          "CodeNewRoman Nerd Font", Georgia, "Noto Serif SC", "Songti SC", serif;
      }
      /* ═══ Catppuccin Mocha ═══ */
      [data-theme="catppuccin"] {
        --bg: #1e1e2e;
        --surface: #313244;
        --surface2: #45475a;
        --border: #585b70;
        --text: #cdd6f4;
        --subtext: #a6adc8;
        --accent: #89b4fa;
        --accent2: #f38ba8;
        --teal: #94e2d5;
        --r900: #6c7086;
        --r1200: #8a8f98;
        --r1400: #a6e3a1;
        --r1600: #94e2d5;
        --r1900: #89dceb;
        --r2100: #cba6f7;
        --r2400: #fab387;
        --r3000: #f38ba8;
      }
      /* ═══ Gruvbox Dark ═══ */
      [data-theme="gruvbox"] {
        --bg: #282828;
        --surface: #3c3836;
        --surface2: #504945;
        --border: #665c54;
        --text: #ebdbb2;
        --subtext: #a89984;
        --accent: #83a598;
        --accent2: #fb4934;
        --teal: #8ec07c;
        --r900: #928374;
        --r1200: #a89984;
        --r1400: #b8bb26;
        --r1600: #8ec07c;
        --r1900: #83a598;
        --r2100: #d3869b;
        --r2400: #fe8019;
        --r3000: #fb4934;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      /* ═══ 滚动条主题化（Chrome/Edge 等 WebKit——filter 标签区/代码框/页面统一）═══ */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--surface2);
        border-radius: 5px;
        /* 无 border：Chrome 中 border 渲染成一圈黑色轮廓（Firefox 不应用 webkit 伪元素所以正常） */
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--border);
      }
      /* Firefox 滚动条主题化（原生属性，不产生黑圈） */
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--surface2) transparent;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        padding: 20px;
        transition:
          background 0.3s,
          color 0.3s;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 4px;
      }
      h1 .accent {
        color: var(--accent);
      }
      .title-icon {
        width: 22px;
        height: 22px;
        vertical-align: -4px;
        margin-right: 6px;
      }
      .sub {
        color: var(--subtext);
        font-size: 13px;
        margin-bottom: 16px;
        min-height: 20px; /* 冗余高度：中英切换不影响布局 */
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
      }
      .theme-btn {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px 14px;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 13px;
      }
      .theme-btn:hover {
        border-color: var(--accent);
      }
      .topbar-btns {
        display: flex;
        gap: 10px;
      }
      #theme-btn {
        width: 118px; /* 冗余宽度：不受「🎨 Theme/🎨 主题」长度影响 */
      }

      /* 爬取进度条 */
      .progress-bar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 14px;
        margin: 10px 0;
        font-size: 13px;
        color: var(--subtext);
        display: none;
        align-items: center;
        gap: 10px;
        min-height: 40px; /* 冗余高度：中英切换不影响布局 */
      }
      .progress-bar.show {
        display: flex;
      }
      .progress-track {
        flex: 1;
        height: 6px;
        background: var(--surface2);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 0.5s;
      }

      .filters {
        background: var(--surface);
        border-radius: var(--radius);
        padding: 14px;
        margin: 14px 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
        align-items: end;
        border: 1px solid var(--border);
        position: relative; /* 迷你按钮右上角定位 */
      }
      .filters label {
        display: block;
        font-size: 12px;
        color: var(--subtext);
        margin-bottom: 4px;
        white-space: nowrap; /* 防中英切换换行 */
        height: 16px; /* 固定高度：中英文字行高差异不影响 */
        line-height: 16px;
        overflow: hidden;
      }
      .filters > div {
        min-height: 58px; /* 冗余高度：中英切换不影响整体高度 */
      }
      /* 数字输入框去掉上下增减按钮（Chrome/Edge spin button + Firefox 原生） */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
      }
      .filters input,
      .filters select {
        width: 100%;
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 9px;
        font-size: 13px;
        height: 34px; /* 固定高度：中英占位符/选项不影响组件尺寸 */
      }
      .filters input:focus,
      .filters select:focus {
        outline: none;
        border-color: var(--accent);
      }
      .reset-btn {
        width: 100%;
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 9px;
        font-size: 13px;
        cursor: pointer;
      }
      .reset-btn:hover {
        border-color: var(--accent);
      }
      .tag-chips {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-height: 84px;
        overflow-y: auto;
      }
      .chip {
        background: var(--surface2);
        color: var(--subtext);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3px 10px;
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }
      .chip.on {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
        font-weight: 600;
      }
      .stats-line {
        color: var(--subtext);
        font-size: 13px;
        margin-bottom: 10px;
        min-height: 20px; /* 冗余高度：中英切换不影响布局 */
      }
      .stats-line b {
        color: var(--accent);
      }
      .reset-btn.mini {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 88px; /* 固定宽度：Default/默认 切换不变 */
        text-align: center;
        height: 24px; /* 固定高度：中英字体行高差异不影响 */
        line-height: 22px;
        padding: 0 9px;
        font-size: 12px;
        border-radius: 5px;
        background: transparent;
        color: var(--subtext);
        z-index: 1;
      }
      .reset-btn.mini:hover {
        color: var(--text);
        border-color: var(--accent);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border-radius: var(--radius);
        overflow: hidden;
      }
      thead th {
        text-align: left;
        padding: 10px 12px;
        font-size: 12px;
        color: var(--subtext);
        background: var(--surface2);
        white-space: nowrap;
        height: 38px; /* 固定高度（table-cell 语义=最小高度）：中英切换不影响表头 */
        vertical-align: middle;
      }
      tbody tr {
        border-top: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.15s;
      }
      tbody tr:hover {
        background: var(--surface2);
      }
      td {
        padding: 9px 12px;
        font-size: 13px;
        vertical-align: middle;
        line-height: 24px; /* 冗余行高：内容行盒富余，垂直位置稳定 */
      }
      tbody tr {
        height: 44px; /* 冗余行高（9px×2 + 24px + 2px 富余）：行内字符上下位置不受语言/字体度量影响 */
      }
      .id {
        font-family: monospace;
        color: var(--accent);
        white-space: nowrap;
        width: 96px; /* 冗余宽度：列宽固定，不受 ID 长度影响 */
      }
      .link-td {
        width: 88px; /* 冗余宽度：不受「打开 ↗/Open ↗」长度影响 */
        white-space: nowrap;
      }
      .link-td .link {
        display: inline-block;
        width: 72px; /* 固定宽度：中英链接文字位置稳定 */
      }
      /* ═══ 本地解题代码复制按钮（与 srcdoc 样例框同逻辑）═══ */
      .copy-wrap {
        position: relative;
      }
      .copy-btn {
        position: absolute;
        top: 6px;
        right: 8px;
        z-index: 5;
        font:
          14px "CodeNewRoman Nerd Font",
          var(--sans);
        color: var(--accent);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        width: 24px;
        height: 24px;
        padding: 0;
        line-height: 24px;
        text-align: center;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s;
        user-select: none;
        box-sizing: border-box;
      }
      .copy-wrap:hover .copy-btn,
      .copy-btn:focus {
        opacity: 1;
      }
      .copy-btn:hover {
        color: var(--text);
        background: var(--surface2);
        border-color: var(--border);
      }
      .copy-btn.ok {
        color: var(--teal);
        border-color: var(--border);
      }
      .name {
        max-width: 340px;
      }
      .rating {
        font-weight: 700;
        white-space: nowrap;
        width: 80px; /* 冗余宽度：不受「800/3500/—」长度影响 */
      }
      .solved {
        font-family: monospace;
        white-space: nowrap;
      }
      .tags-td {
        max-width: 380px;
      }
      .tags-wrap {
        display: flex;
        align-items: center; /* 中心对齐：不依赖字体基线/x-height，零抖动 */
        flex-wrap: wrap;
        gap: 6px;
        height: 100%;
      }
      .mini-tag {
        display: inline-block;
        font-size: 11px;
        color: var(--subtext);
        line-height: 1;
      }
      .link {
        color: var(--accent);
        text-decoration: none;
        font-size: 12px;
      }
      .link:hover {
        text-decoration: underline;
      }
      .empty {
        text-align: center;
        color: var(--subtext);
        padding: 40px;
      }

      .pager {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .pager button {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
      }
      .pager button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .pager button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .pager .cur {
        background: var(--accent);
        color: var(--bg);
        font-weight: 700;
        border-color: var(--accent);
      }
      .pager .info {
        color: var(--subtext);
        font-size: 12px;
      }

      /* ═══ 详情视图（新页面式）═══ */
      #detail-view {
        display: none;
        max-width: 1200px;
        margin: 0 auto;
      }
      #detail-view.show {
        display: block;
      }
      .detail-bar {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 16px;
        margin-bottom: 18px;
      }
      .back-btn {
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 14px;
        cursor: pointer;
        font-size: 13px;
        height: 34px; /* 固定高度：中英文字行高差异不影响 */
        line-height: 20px;
        width: 116px; /* 固定宽度：← Back / ← 返回 切换不影响后续元素位置 */
        text-align: center;
      }
      /* SVG 箭头：几何渲染，不依赖字体字形（Chrome 的 ← 字形基线偏移问题） */
      .back-arrow {
        width: 12px;
        height: 12px;
        vertical-align: -1px;
        margin-right: 5px;
        display: inline-block;
      }
      .back-btn:hover {
        border-color: var(--accent);
      }
      .detail-title {
        font-size: 16px;
        font-weight: 600;
        flex: 1;
        min-width: 200px;
      }
      .detail-meta {
        font-size: 12px;
        color: var(--subtext);
        max-width: 340px;
        white-space: nowrap; /* 单行：中英长度差异不引发换行/高度变化 */
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-shrink: 0; /* 不被压缩：英文按钮文字保持一行 */
      }
      .tab {
        background: var(--surface2);
        color: var(--subtext);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 18px;
        cursor: pointer;
        font-size: 13px;
        height: 34px; /* 固定高度：中英文字行高差异不影响 */
        line-height: 20px;
        width: 140px; /* 固定宽度：📄 Statement / 📄 题面 都容纳，中英切换不变 */
        text-align: center;
        white-space: nowrap; /* 按钮内文字不换行 */
      }
      .tab.on {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
        font-weight: 600;
      }

      /* 阅读区：居中窄栏，衬线排版，无内部滚动条（高度自适应） */
      .reader {
        max-width: 1200px; /* 与上方 detail-bar 同宽对齐 */
        margin: 0 auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px 34px;
      }
      .reader .hint {
        color: var(--subtext);
        text-align: center;
        padding: 50px 0;
        font-size: 14px;
        line-height: 2;
      }
      .statement-frame {
        width: 100%;
        border: none;
        display: block;
        background: transparent;
        min-height: 420px;
      }
      /* ═══ 代码高亮主题（CSS 变量 → 自动跟随 catppuccin/gruvbox）═══ */
      .hljs {
        background: transparent;
        color: var(--text);
      }
      .hljs-keyword,
      .hljs-selector-tag,
      .hljs-literal {
        color: var(--accent2);
      }
      .hljs-string,
      .hljs-regexp,
      .hljs-addition {
        color: var(--teal);
      }
      .hljs-number,
      .hljs-symbol,
      .hljs-bullet {
        color: var(--r2400);
      }
      .hljs-comment,
      .hljs-quote {
        color: var(--subtext);
        font-style: italic;
      }
      .hljs-title,
      .hljs-function,
      .hljs-title.function_,
      .hljs-section {
        color: var(--accent);
      }
      .hljs-type,
      .hljs-built_in,
      .hljs-attr,
      .hljs-attribute,
      .hljs-variable,
      .hljs-template-variable {
        color: var(--r1900);
      }
      .hljs-meta,
      .hljs-selector-class,
      .hljs-selector-id {
        color: var(--r2100);
      }
      .hljs-params {
        color: var(--text);
      }
      .hljs-deletion {
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <!-- ═══ 列表视图 ═══ -->
    <div class="container" id="list-view">
      <div class="topbar">
        <div>
          <h1>
            <img class="title-icon" src="/vendor/cf-favicon.png" alt="CF" />CF
            <span class="accent">Database</span>
          </h1>
          <div class="sub" id="total-line">Loading...</div>
        </div>
        <div class="topbar-btns">
          <button class="theme-btn" id="lang-btn" onclick="toggleLang()">
            文
          </button>
          <button
            class="theme-btn"
            id="theme-btn"
            onclick="toggleTheme()"
            data-i18n="theme"
          >
            Theme
          </button>
        </div>
      </div>

      <div class="progress-bar" id="progress-bar">
        <span id="progress-text" data-i18n="preCrawling">Pre-crawling...</span>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="filters">
        <button
          class="reset-btn mini"
          data-i18n-title="resetTitle"
          title="Reset filters"
          onclick="resetFilters()"
        >
          <span data-i18n="reset">Default</span>
        </button>
        <div>
          <label data-i18n="ratingMin">Min Rating</label
          ><input
            type="number"
            id="f-rmin"
            placeholder="800"
            min="800"
            max="3500"
          />
        </div>
        <div>
          <label data-i18n="ratingMax">Max Rating</label
          ><input
            type="number"
            id="f-rmax"
            placeholder="3500"
            min="800"
            max="3500"
          />
        </div>
        <div>
          <label data-i18n="solvedAtLeast">Solved ≥</label
          ><input type="number" id="f-solved" placeholder="0" />
        </div>
        <div>
          <label data-i18n="search">Search</label
          ><input
            type="text"
            id="f-search"
            placeholder="e.g. tree / dp / 1400..."
            data-i18n-ph="searchPh"
          />
        </div>
        <div>
          <label data-i18n="sort">Sort</label>
          <select id="f-sort">
            <option value="rating-desc" data-i18n-opt="ratingDesc">
              Rating ↓
            </option>
            <option value="rating-asc" data-i18n-opt="ratingAsc">
              Rating ↑
            </option>
            <option value="solved-desc" data-i18n-opt="solvedDesc">
              Solved ↓
            </option>
            <option value="solved-asc" data-i18n-opt="solvedAsc">
              Solved ↑
            </option>
            <option value="id-asc" selected data-i18n-opt="idAsc">ID ↑</option>
            <option value="id-desc" data-i18n-opt="idDesc">ID ↓</option>
            <option value="name-asc" data-i18n-opt="nameAsc">Name</option>
          </select>
        </div>
        <div class="tag-chips" id="tag-chips"></div>
      </div>

      <div class="stats-line" id="stats-line"></div>
      <table>
        <thead>
          <tr>
            <th data-i18n="colId">ID</th>
            <th data-i18n="colName">Name</th>
            <th data-i18n="colRating">Rating</th>
            <th data-i18n="colSolved">Solved</th>
            <th data-i18n="colTags">Tags</th>
            <th data-i18n="colLink">Link</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="pager" id="pager"></div>
    </div>

    <!-- ═══ 详情视图 ═══ -->
    <div id="detail-view">
      <div class="detail-bar">
        <button class="back-btn" onclick="goBack()">
          <svg
            class="back-arrow"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 5l-7 7 7 7" /></svg
          ><span data-i18n="back">Back</span>
        </button>
        <div class="detail-title" id="detail-title"></div>
        <div class="detail-meta" id="detail-meta"></div>
        <div class="tabs">
          <button
            class="tab on"
            id="tab-statement"
            onclick="switchTab('statement')"
          >
            <span data-i18n="tabStatement">📄 Statement</span>
          </button>
          <button
            class="tab"
            id="tab-editorial"
            onclick="switchTab('editorial')"
          >
            <span data-i18n="tabEditorial">📖 Editorial</span>
          </button>
        </div>
      </div>
      <div class="reader" id="reader"></div>
    </div>

    <script>
      /* ═══ i18n（默认英文，localStorage 记忆；「文/En」按钮切换）═══ */
      let lang = "en";
      try {
        lang = localStorage.getItem("cfdb-lang") || "en";
      } catch (e) {}
      const I18N = {
        en: {
          title: "Codeforces Database — Codeforces Problem Library",
          loading: "Loading...",
          theme: "🎨 Theme",
          preCrawling: "Pre-crawling...",
          reset: "Default",
          resetTitle: "Reset filters",
          ratingMin: "Min Rating",
          ratingMax: "Max Rating",
          solvedAtLeast: "Solved ≥",
          search: "Search",
          searchPh: "e.g. tree / dp / 1400...",
          sort: "Sort",
          ratingDesc: "Rating ↓",
          ratingAsc: "Rating ↑",
          solvedDesc: "Solved ↓",
          solvedAsc: "Solved ↑",
          idAsc: "ID ↑",
          idDesc: "ID ↓",
          nameAsc: "Name",
          colId: "ID",
          colName: "Name",
          colRating: "Rating",
          colSolved: "Solved",
          colTags: "Tags",
          colLink: "Link",
          back: "Back",
          tabStatement: "📄 Statement",
          tabEditorial: "📖 Editorial",
          totalLine: "Total: {n} problems (rated: {r}, 800-3500)",
          filtered: "Filtered: ",
          problems: " problems",
          noMatch: "No matching problems",
          open: "Open ↗",
          solvedBadge: "Solved by me",
          stageMeta: "Refreshing metadata",
          stageStatements: "Crawling statements",
          stageEditorials: "Crawling editorials",
          stageDone: "Done",
          stageError: "Error",
          stageIdle: "Idle",
          progress:
            "{stage}: {done}/{total} (fetched {fetched}, cached {cached}, failed {failed})",
          detailMeta: "Rating: {r} · Solved: {s} · {tags}",
          readerLoading: "Loading...",
          noStatement:
            "Statement not downloaded yet.\n\nThe server auto-crawls on startup (progress bar on top),\nor run: python3 update.py --statements",
          loadFail: "Load failed: ",
          noEditorialKnown:
            "This contest has no public Editorial (official solutions not published).",
          noEditorialUnknown:
            "No public Editorial for this contest (or crawl failed).\n\nYou can pre-crawl: python3 update.py --editorials",
          editorialFail: "Editorial load failed: ",
          mySolutions: "💻 My Solutions",
          openProblem: "Open on Codeforces",
          openTop: "Open ↗",
          imgMissing: "🖼️ Image not loaded",
          langName: {
            rs: "Rust",
            cpp: "C++",
            cc: "C++",
            cxx: "C++",
            c: "C",
            py: "Python",
            java: "Java",
            go: "Go",
            ts: "TypeScript",
            js: "JavaScript",
            kt: "Kotlin",
          },
        },
        zh: {
          title: "Codeforces Database — Codeforces 题目库",
          loading: "加载中...",
          theme: "🎨 主题",
          preCrawling: "预爬中...",
          reset: "默认",
          resetTitle: "恢复默认筛选",
          ratingMin: "分数下限",
          ratingMax: "分数上限",
          solvedAtLeast: "解题数 ≥",
          search: "搜索名称",
          searchPh: "例如: tree / dp / 1400...",
          sort: "排序",
          ratingDesc: "分数降序",
          ratingAsc: "分数升序",
          solvedDesc: "解题数 降序",
          solvedAsc: "解题数 升序",
          idAsc: "题号 升序",
          idDesc: "题号 降序",
          nameAsc: "名称",
          colId: "题号",
          colName: "名称",
          colRating: "分数",
          colSolved: "解题数",
          colTags: "标签",
          colLink: "链接",
          back: "返回",
          tabStatement: "📄 题面",
          tabEditorial: "📖 题解",
          totalLine: "共 {n} 题（有分数标注: {r} 题，范围 800-3500）",
          filtered: "筛选结果: ",
          problems: " 题",
          noMatch: "没有匹配的题目",
          open: "打开 ↗",
          solvedBadge: "已做过（有解题代码）",
          stageMeta: "刷新元数据",
          stageStatements: "预爬题面",
          stageEditorials: "预爬题解",
          stageDone: "完成",
          stageError: "异常",
          stageIdle: "空闲",
          progress:
            "{stage}：{done}/{total}（已爬 {fetched}，已有 {cached}，失败 {failed}）",
          detailMeta: "分数: {r} · 解题: {s} · {tags}",
          readerLoading: "加载中...",
          noStatement:
            "这道题还没下载过题面。\n\n服务器启动时会自动预爬全部题目（顶部有进度条），\n也可以手动运行：python3 update.py --statements",
          loadFail: "加载失败：",
          noEditorialKnown: "该比赛没有公开的 Editorial（官方未发布题解）。",
          noEditorialUnknown:
            "该比赛没有公开的 Editorial（或尚未爬取成功）。\n\n可以手动预爬：python3 update.py --editorials",
          editorialFail: "题解加载失败：",
          mySolutions: "💻 我的解题代码",
          openProblem: "在 Codeforces 打开原题",
          openTop: "打开 ↗",
          imgMissing: "🖼️ 图片未加载",
          langName: {
            rs: "Rust",
            cpp: "C++",
            cc: "C++",
            cxx: "C++",
            c: "C",
            py: "Python",
            java: "Java",
            go: "Go",
            ts: "TypeScript",
            js: "JavaScript",
            kt: "Kotlin",
          },
        },
      };
      function t(key) {
        return (I18N[lang] || I18N.en)[key] ?? I18N.en[key] ?? key;
      }
      function toggleLang() {
        lang = lang === "en" ? "zh" : "en";
        try {
          localStorage.setItem("cfdb-lang", lang);
        } catch (e) {}
        applyI18n();
      }
      function applyI18n() {
        document.title = t("title");
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.textContent = t(el.dataset.i18n);
        });
        // 语言按钮：显示「将要切换到的语言」（英文界面→文，中文界面→En）
        const lb = document.getElementById("lang-btn");
        if (lb) lb.textContent = lang === "en" ? "文" : "En";
        // 计数器：已加载显示统计，未加载显示 loading（避免被静态替换覆盖）
        if (ALL.length) {
          const rated = ALL.filter((p) => p.rating).length;
          $("total-line").textContent = t("totalLine")
            .replace("{n}", ALL.length)
            .replace("{r}", rated);
        } else {
          $("total-line").textContent = t("loading");
        }
        document.querySelectorAll("[data-i18n-title]").forEach((el) => {
          el.title = t(el.dataset.i18nTitle);
        });
        document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
          el.placeholder = t(el.dataset.i18nPh);
        });
        document.querySelectorAll("[data-i18n-opt]").forEach((el) => {
          el.textContent = t(el.dataset.i18nOpt);
        });
        if (currentProblem) {
          rebuildDetail();
        } else {
          render();
        }
      }
      function rebuildDetail() {
        if (!currentProblem) return;
        $("detail-title").textContent =
          `${currentProblem.contestId}${currentProblem.index} — ${currentProblem.name}`;
        $("detail-meta").textContent = t("detailMeta")
          .replace("{r}", currentProblem.rating ?? "—")
          .replace("{s}", fmt(currentProblem.solvedCount))
          .replace("{tags}", currentProblem.tags.join(" / "));
        const reader = $("reader");
        reader.replaceChildren();
        if (tabCache[currentTab]) {
          reader.appendChild(
            mdFrame(tabCache[currentTab].md, tabCache[currentTab].url),
          );
          if (currentTab === "statement") renderSolutions(reader);
        } else {
          loadTab(currentTab);
        }
      }

      let ALL = [],
        FILTERED = [];
      const PAGE = 50;
      let page = 1;
      const activeTags = new Set();
      let restorePage = 1;

      /* 筛选状态持久化到 URL 参数（刷新/滚动天然保留，无写入竞态） */
      function saveState() {
        try {
          const p = new URLSearchParams();
          if ($("f-rmin").value) p.set("rmin", $("f-rmin").value);
          if ($("f-rmax").value) p.set("rmax", $("f-rmax").value);
          if ($("f-solved").value) p.set("solved", $("f-solved").value);
          if ($("f-search").value) p.set("search", $("f-search").value);
          if ($("f-sort").value !== "id-asc") p.set("sort", $("f-sort").value);
          if (activeTags.size) p.set("tags", [...activeTags].join(","));
          if (page > 1) p.set("page", page);
          const qs = p.toString();
          const url = location.pathname + (qs ? "?" + qs : "") + location.hash;
          history.replaceState(null, "", url); // 不产生历史记录
        } catch (e) {}
      }
      function restoreState() {
        try {
          const p = new URLSearchParams(location.search);
          $("f-rmin").value = p.get("rmin") || "";
          $("f-rmax").value = p.get("rmax") || "";
          $("f-solved").value = p.get("solved") || "";
          $("f-search").value = p.get("search") || "";
          $("f-sort").value = p.get("sort") || "id-asc";
          activeTags.clear();
          const tags = p.get("tags");
          if (tags) tags.split(",").forEach((t) => activeTags.add(t));
          restorePage = parseInt(p.get("page")) || 1;
        } catch (e) {}
      }

      let currentProblem = null;
      let tabCache = {}; // { 'statement': {md, html} | null, 'editorial': ... }
      let currentTab = "statement";
      let loadSeq = 0; // 加载请求序列号：切 tab/切题后旧响应直接丢弃（防竞态覆盖）

      const $ = (id) => document.getElementById(id);
      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }

      /* ═══ 数据加载 ═══ */
      async function load() {
        try {
          const r = await fetch("/api/problems");
          ALL = await r.json();
          const rated = ALL.filter((p) => p.rating).length;
          $("total-line").textContent = t("totalLine")
            .replace("{n}", ALL.length)
            .replace("{r}", rated);
          restoreState();
          buildTagChips();
          apply();
          page = restorePage; // 恢复页码（apply 会重置为 1）
          render();
          pollProgress();
        } catch (err) {
          $("total-line").textContent = t("loadFail") + err;
        }
      }

      /* ═══ 预爬进度 ═══ */
      const STAGE_CN = {
        meta: "stageMeta",
        statements: "stageStatements",
        editorials: "stageEditorials",
        done: "stageDone",
        error: "stageError",
        idle: "stageIdle",
      };
      let lastDone = -1;
      let lastRefresh = 0;

      /* 静默刷新题目数据（不重置筛选/页码），让列表标记自动更新 */
      async function refreshData() {
        try {
          const r = await fetch("/api/problems");
          ALL = await r.json();
          const savedPage = page;
          apply();
          page = savedPage;
          render();
        } catch (e) {}
      }

      async function pollProgress() {
        try {
          const r = await fetch("/api/progress");
          const s = await r.json();
          const bar = $("progress-bar");
          if (s.stage === "idle" || s.stage === "done") {
            bar.classList.remove("show");
          } else {
            bar.classList.add("show");
            $("progress-text").textContent = t("progress")
              .replace("{stage}", t(STAGE_CN[s.stage] || s.stage))
              .replace("{done}", s.done)
              .replace("{total}", s.total)
              .replace("{fetched}", s.fetched)
              .replace("{cached}", s.cached)
              .replace("{failed}", s.failed);
            $("progress-fill").style.width = s.total
              ? (s.done / s.total) * 100 + "%"
              : "0%";
          }
          // 进度推进或爬取结束 → 自动刷新列表标记（节流 10s）
          const busy =
            s.stage === "meta" ||
            s.stage === "statements" ||
            s.stage === "editorials";
          if (s.done !== lastDone || (busy === false && lastDone !== -1)) {
            const now = Date.now();
            if (now - lastRefresh > 10000) {
              lastRefresh = now;
              refreshData();
            }
          }
          lastDone = s.done;
        } catch (e) {}
        setTimeout(pollProgress, 2000);
      }

      /* ═══ 标签筛选 ═══ */
      function buildTagChips() {
        const counts = {};
        for (const p of ALL)
          for (const t of p.tags) counts[t] = (counts[t] || 0) + 1;
        const box = $("tag-chips");
        box.replaceChildren();
        Object.entries(counts)
          .sort((a, b) => b[1] - a[1])
          .forEach(([t, c]) => {
            const chip = el("span", "chip", `${t} (${c})`);
            chip.dataset.tag = t;
            if (activeTags.has(t)) chip.classList.add("on"); // 恢复选中
            chip.onclick = () => toggleTag(chip);
            box.appendChild(chip);
          });
      }
      function toggleTag(chip) {
        const t = chip.dataset.tag;
        if (activeTags.has(t)) {
          activeTags.delete(t);
          chip.classList.remove("on");
        } else {
          activeTags.add(t);
          chip.classList.add("on");
        }
        apply();
        saveState(); // 标签变化即保存
      }

      /* 恢复默认筛选 */
      function resetFilters() {
        $("f-rmin").value = "";
        $("f-rmax").value = "";
        $("f-solved").value = "";
        $("f-search").value = "";
        $("f-sort").value = "id-asc";
        activeTags.clear();
        document
          .querySelectorAll(".tag-chips .chip.on")
          .forEach((c) => c.classList.remove("on"));
        restorePage = 1;
        try {
          history.replaceState(null, "", location.pathname + location.hash);
        } catch (e) {}
        apply();
      }

      /* ═══ 筛选 + 排序 ═══ */
      function apply() {
        const rmin = parseInt($("f-rmin").value) || 0;
        const rmax = parseInt($("f-rmax").value) || 99999;
        const solved = parseInt($("f-solved").value) || 0;
        const q = $("f-search").value.trim().toLowerCase();
        const sort = $("f-sort").value;

        FILTERED = ALL.filter((p) => {
          if (p.rating && (p.rating < rmin || p.rating > rmax)) return false;
          if (!p.rating && rmin > 0) return false;
          if (p.solvedCount < solved) return false;
          if (activeTags.size && !p.tags.some((t) => activeTags.has(t)))
            return false;
          if (
            q &&
            !(
              p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)
            )
          )
            return false;
          return true;
        });

        const cmp = {
          "rating-desc": (a, b) => (b.rating || -1) - (a.rating || -1),
          "rating-asc": (a, b) => (a.rating || 99999) - (b.rating || 99999),
          "solved-desc": (a, b) => b.solvedCount - a.solvedCount,
          "solved-asc": (a, b) => a.solvedCount - b.solvedCount,
          "id-asc": (a, b) =>
            a.contestId - b.contestId || a.index.localeCompare(b.index),
          "id-desc": (a, b) =>
            b.contestId - a.contestId || b.index.localeCompare(a.index),
          "name-asc": (a, b) => a.name.localeCompare(b.name),
        }[sort];
        FILTERED.sort(cmp);
        page = 1;
        render();
      }

      /* ═══ 列表渲染 ═══ */
      function ratingColor(r) {
        if (!r) return "var(--subtext)";
        if (r < 1200) return "var(--r900)";
        if (r < 1400) return "var(--r1200)";
        if (r < 1600) return "var(--r1400)";
        if (r < 1900) return "var(--r1600)";
        if (r < 2100) return "var(--r1900)";
        if (r < 2400) return "var(--r2100)";
        if (r < 3000) return "var(--r2400)";
        return "var(--r3000)";
      }
      function fmt(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
        if (n >= 1000) return (n / 1000).toFixed(1) + "k";
        return String(n);
      }
      function render() {
        const line = $("stats-line");
        line.replaceChildren();
        line.appendChild(el("span", null, t("filtered")));
        const b = el("b", null, String(FILTERED.length));
        line.appendChild(b);
        line.appendChild(el("span", null, t("problems")));

        const totalPages = Math.max(1, Math.ceil(FILTERED.length / PAGE));
        if (page > totalPages) page = totalPages;
        const slice = FILTERED.slice((page - 1) * PAGE, page * PAGE);

        const tb = $("tbody");
        tb.replaceChildren();
        if (!slice.length) {
          const tr = el("tr");
          const td = el("td", "empty", t("noMatch"));
          td.colSpan = 6;
          tr.appendChild(td);
          tb.appendChild(tr);
        }
        for (const p of slice) {
          const tr = el("tr");
          tr.onclick = () => showDetail(p);
          const idTd = el("td", "id", `${p.contestId}${p.index}`);
          const nameTd = el("td", "name", p.name);
          if (p.hasSolution) {
            // 已有解题代码：主题蓝绿色标识
            idTd.style.color = "var(--teal)";
            nameTd.style.color = "var(--teal)";
            nameTd.style.fontWeight = "600";
            tr.title = t("solvedBadge");
          }
          tr.appendChild(idTd);
          tr.appendChild(nameTd);
          const rd = el("td", "rating", p.rating ? String(p.rating) : "—");
          rd.style.color = ratingColor(p.rating);
          tr.appendChild(rd);
          tr.appendChild(el("td", "solved", fmt(p.solvedCount)));
          const tagsTd = el("td", "tags-td");
          const tagsWrap = el("div", "tags-wrap");
          p.tags
            .slice(0, 4)
            .forEach((t) => tagsWrap.appendChild(el("span", "mini-tag", t)));
          tagsTd.appendChild(tagsWrap);
          tr.appendChild(tagsTd);
          const linkTd = el("td", "link-td");
          const a = el("a", "link", t("open"));
          a.href = p.url;
          a.target = "_blank";
          a.onclick = (e) => e.stopPropagation();
          linkTd.appendChild(a);
          tr.appendChild(linkTd);
          tb.appendChild(tr);
        }

        const pager = $("pager");
        pager.replaceChildren();
        const mkBtn = (label, fn, disabled) => {
          const b = el("button", null, label);
          b.disabled = !!disabled;
          b.onclick = fn;
          pager.appendChild(b);
          return b;
        };
        mkBtn("«", () => go(1), page === 1);
        mkBtn("‹", () => go(page - 1), page === 1);
        for (
          let i = Math.max(1, page - 2);
          i <= Math.min(totalPages, page + 2);
          i++
        ) {
          const b = mkBtn(String(i), () => go(i), false);
          if (i === page) b.classList.add("cur");
        }
        mkBtn("›", () => go(page + 1), page === totalPages);
        mkBtn("»", () => go(totalPages), page === totalPages);
        pager.appendChild(el("span", "info", `${page}/${totalPages}`));
      }
      function go(n) {
        page = n;
        render();
        saveState(); // 翻页保存页码（刷新后恢复）
      }

      /* ═══ 视图切换 ═══ */
      function showDetail(p) {
        if (location.hash !== "#/problem/" + p.id) {
          try {
            history.pushState(null, "", "#/problem/" + p.id);
          } catch (e) {}
        }
        currentProblem = p;
        tabCache = {};
        currentTab = "statement";
        $("list-view").style.display = "none";
        $("detail-view").classList.add("show");
        $("detail-title").textContent = `${p.contestId}${p.index} — ${p.name}`;
        $("detail-meta").textContent = t("detailMeta")
          .replace("{r}", p.rating ?? "—")
          .replace("{s}", fmt(p.solvedCount))
          .replace("{tags}", p.tags.join(" / "));
        $("tab-statement").classList.add("on");
        $("tab-editorial").classList.remove("on");
        loadTab("statement");
      }
      /* 按钮返回 = 浏览器后退（同一套 popstate 逻辑） */
      function goBack() {
        history.back();
        // 兜底：直接打开详情 URL（无历史可退）时，back 无效 → 手动回列表
        setTimeout(() => {
          if (location.hash.startsWith("#/problem/")) showList();
        }, 120);
      }
      function showList() {
        try {
          // 保留 search（filter 参数）——只清 #/problem/ 详情 hash，
          // 否则返回列表后刷新 filter 全部丢失
          history.replaceState(null, "", location.pathname + location.search);
        } catch (e) {}
        loadSeq++; // 离开详情页：所有在途请求作废
        currentProblem = null;
        $("detail-view").classList.remove("show");
        $("list-view").style.display = "";
      }

      /* ═══ 标签页：题面 / 题解 ═══ */
      function switchTab(tab) {
        if (tab === currentTab) return;
        currentTab = tab;
        $("tab-statement").classList.toggle("on", tab === "statement");
        $("tab-editorial").classList.toggle("on", tab === "editorial");
        loadTab(tab);
      }
      function loadTab(tab) {
        if (!currentProblem) return;
        const seq = ++loadSeq; // 本次加载请求的序列号
        const reader = $("reader");
        reader.replaceChildren();
        if (tabCache[tab]) {
          reader.appendChild(mdFrame(tabCache[tab].md, tabCache[tab].url));
          // 缓存恢复也要渲染题面底部的解题代码
          if (tab === "statement") renderSolutions(reader, seq);
          return;
        }
        reader.appendChild(el("div", "hint", t("readerLoading")));
        if (tab === "editorial") {
          loadEditorial(reader, seq);
          return;
        }
        fetch(

      function parseHash() {
        const m = location.hash.match(/#\/problem\/(\d+)([A-Za-z0-9]+)/); // index 可含数字（A1/F2/01）
        if (m) {
          const p = ALL.find(
            (x) =>
              x.contestId === Number(m[1]) && x.index === m[2].toUpperCase(),
          );
          if (p) showDetail(p);
        }
      }
      window.addEventListener("hashchange", parseHash);
      // 浏览器前进/后退：popstate 触发（pushState 不触发 hashchange）
      window.addEventListener("popstate", () => {
        if (location.hash.startsWith("#/problem/")) {
